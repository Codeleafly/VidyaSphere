<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>School Polls &amp; Elections | VidyaSphere</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f172a">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/css/custom.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col md:flex-row pb-16 md:pb-0 w-full">

  <main class="flex-1 w-full max-w-5xl mx-auto p-3.5 sm:p-6 lg:p-8 space-y-5">
    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 pb-3 border-b border-slate-200/80">
      <div>
        <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight text-slate-900">School Polls &amp; Elections</h1>
        <p class="text-xs text-slate-500">Duplicate-proof student voting, council elections &amp; survey topics</p>
      </div>
      <button id="open-create-poll-btn"
        class="w-full sm:w-auto px-4 py-2.5 rounded-xl bg-slate-900 hover:bg-indigo-600 text-white font-bold text-xs transition flex items-center justify-center gap-2">
        <i data-lucide="plus" class="w-4 h-4"></i> Create Poll
      </button>
    </div>

    <div id="polls-container" class="space-y-4 w-full">
      <div class="p-8 text-center text-slate-400 bg-white rounded-2xl border border-slate-200/80 text-xs">Loading polls...</div>
    </div>
  </main>

  <!-- Create Poll Modal -->
  <div id="create-poll-modal" class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs hidden items-center justify-center p-3 sm:p-4">
    <div class="bg-white rounded-2xl w-full max-w-[95vw] sm:max-w-md p-5 space-y-3.5 shadow-2xl border border-slate-200/80 overflow-y-auto max-h-[90vh] modal-enter">
      <div class="flex items-center justify-between pb-2 border-b border-slate-100">
        <h3 class="text-base font-bold text-slate-900">Create a School Poll</h3>
        <button id="close-poll-modal" class="text-slate-400 hover:text-slate-700 text-xl font-bold p-1">&times;</button>
      </div>
      <form id="poll-form" class="space-y-3">
        <div>
          <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1">Poll Question</label>
          <input type="text" id="poll-question" required class="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs sm:text-sm" placeholder="e.g. Topic for the next science exhibition?">
        </div>
        <div class="space-y-2" id="poll-options-list">
          <div class="flex items-center justify-between">
            <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500">Options (Min 2)</label>
            <button type="button" id="add-poll-option-btn" class="text-[11px] font-bold text-indigo-600 hover:underline">+ Add Option</button>
          </div>
          <input type="text" class="poll-option-input w-full px-3 py-2 rounded-xl border border-slate-200 text-xs sm:text-sm" placeholder="Option 1" required>
          <input type="text" class="poll-option-input w-full px-3 py-2 rounded-xl border border-slate-200 text-xs sm:text-sm" placeholder="Option 2" required>
          <input type="text" class="poll-option-input w-full px-3 py-2 rounded-xl border border-slate-200 text-xs sm:text-sm" placeholder="Option 3 (Optional)">
        </div>
        <button type="submit" class="w-full py-2.5 rounded-xl bg-slate-900 hover:bg-indigo-600 text-white font-bold text-xs sm:text-sm transition">Launch Poll</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { apiRequest } from '/js/api.js';
    import { initDashboardShell } from '/js/layout.js';
    import { escapeHtml, formatDate, showToast, initIcons, bindModalBackdropAndEsc } from '/js/ui.js';

    const user = initDashboardShell({ active: 'polls', mobileTitle: 'School Polls' });

    const pollsContainer = document.getElementById('polls-container');
    const createPollModal = document.getElementById('create-poll-modal');
    const closePoll = () => { createPollModal.classList.add('hidden'); createPollModal.classList.remove('flex'); };

    document.getElementById('open-create-poll-btn').addEventListener('click', () => {
      createPollModal.classList.remove('hidden');
      createPollModal.classList.add('flex');
    });
    document.getElementById('close-poll-modal').addEventListener('click', closePoll);
    bindModalBackdropAndEsc(createPollModal, closePoll);

    document.getElementById('add-poll-option-btn').addEventListener('click', () => {
      const list = document.getElementById('poll-options-list');
      const count = list.querySelectorAll('.poll-option-input').length;
      if (count >= 8) {
        showToast('Maximum 8 options allowed', 'warning');
        return;
      }
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'poll-option-input w-full px-3 py-2 rounded-xl border border-slate-200 text-xs sm:text-sm';
      input.placeholder = `Option ${count + 1} (Optional)`;
      list.appendChild(input);
    });

    async function loadPolls() {
      try {
        const res = await apiRequest('/polls');
        const polls = res.polls || [];

        if (polls.length === 0) {
          pollsContainer.innerHTML = `
            <div class="p-10 text-center text-slate-400 bg-white rounded-2xl border border-slate-200/80">
              <i data-lucide="vote" class="w-8 h-8 mx-auto mb-2 opacity-40"></i>
              <p class="text-sm font-semibold text-slate-700">No active polls right now</p>
              <p class="text-xs text-slate-400 mt-1">Teachers and students can launch polls above.</p>
            </div>
          `;
          initIcons();
          return;
        }

        pollsContainer.innerHTML = polls.map(poll => {
          const hasVoted = poll.userVotedOption !== null;
          const canVote = !hasVoted && !poll.isExpired;

          return `
            <article class="bg-white rounded-2xl border border-slate-200/80 p-4 sm:p-6 shadow-[0_1px_2px_rgba(15,23,42,0.03)] space-y-3.5 w-full break-words">
              <div class="flex items-start justify-between flex-wrap gap-2">
                <div>
                  <h3 class="text-base sm:text-lg font-bold text-slate-900 leading-snug">${escapeHtml(poll.question)}</h3>
                  <p class="text-[11px] text-slate-400 mt-0.5 tabular-nums">By ${escapeHtml(poll.creatorName || 'School')} • ${poll.totalVotes} votes</p>
                </div>
                <div class="flex items-center gap-1.5">
                  ${poll.isExpired ? '<span class="px-2 py-0.5 rounded-full text-[10px] font-bold uppercase bg-slate-100 text-slate-600 border border-slate-200">Closed</span>' : ''}
                  ${hasVoted ? '<span class="px-2 py-0.5 rounded-full text-[10px] font-bold uppercase bg-emerald-50 text-emerald-700 border border-emerald-200">Voted</span>' : ''}
                </div>
              </div>

              <div class="space-y-2">
                ${poll.options.map(opt => {
                  const isUserSelection = poll.userVotedOption === opt.index;
                  return `
                    <div class="relative overflow-hidden rounded-xl border ${isUserSelection ? 'border-indigo-500 ring-2 ring-indigo-500/15' : 'border-slate-200/80'} p-3 transition">
                      <div class="absolute inset-y-0 left-0 ${isUserSelection ? 'bg-indigo-100/70' : 'bg-slate-100/80'} transition-all duration-500" style="width: ${opt.percentage}%"></div>
                      <div class="relative z-10 flex items-center justify-between gap-2">
                        <div class="flex items-center gap-2.5 overflow-hidden">
                          ${canVote ? `
                            <button class="vote-action-btn w-5 h-5 rounded-full border-2 border-slate-300 hover:border-indigo-600 hover:bg-indigo-50 flex items-center justify-center shrink-0 transition"
                              data-poll-id="${escapeHtml(poll.id)}" data-opt-idx="${opt.index}" title="Cast Vote">
                              <span class="w-2 h-2 rounded-full bg-indigo-600 opacity-0 hover:opacity-100"></span>
                            </button>
                          ` : (isUserSelection ? '<i data-lucide="check-circle" class="w-4 h-4 text-indigo-600 shrink-0"></i>' : '')}
                          <span class="text-xs sm:text-sm font-semibold text-slate-800 break-words">${escapeHtml(opt.label)}</span>
                        </div>
                        <span class="text-[11px] sm:text-xs font-bold text-slate-600 shrink-0 tabular-nums">${opt.percentage}% (${opt.votes})</span>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>

              <div class="pt-2 border-t border-slate-100 flex items-center justify-between text-[11px] text-slate-400">
                <span>${poll.expiresAt ? 'Ends: ' + escapeHtml(formatDate(poll.expiresAt)) : 'Open Poll'}</span>
                <span>${hasVoted ? 'Duplicate votes locked' : (poll.isExpired ? 'Voting ended' : 'Tap circle to cast vote')}</span>
              </div>
            </article>
          `;
        }).join('');

        initIcons();

        pollsContainer.querySelectorAll('.vote-action-btn').forEach(btn => {
          btn.addEventListener('click', async () => {
            try {
              await apiRequest(`/polls/${encodeURIComponent(btn.dataset.pollId)}/vote`, {
                method: 'POST',
                body: { optionIndex: parseInt(btn.dataset.optIdx, 10) },
              });
              showToast('Vote cast successfully!', 'success');
              loadPolls();
            } catch (err) {
              showToast(err.message, 'error');
            }
          });
        });
      } catch (err) {
        pollsContainer.innerHTML = `<div class="p-6 text-center text-rose-600 bg-rose-50 rounded-2xl text-xs">${escapeHtml(err.message)}</div>`;
      }
    }

    document.getElementById('poll-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const question = document.getElementById('poll-question').value.trim();
      const options = Array.from(document.querySelectorAll('.poll-option-input')).map(i => i.value.trim()).filter(Boolean);
      if (options.length < 2) {
        showToast('Please provide at least 2 options', 'error');
        return;
      }
      try {
        await apiRequest('/polls', { method: 'POST', body: { question, options } });
        showToast('Poll created successfully!', 'success');
        closePoll();
        e.target.reset();
        loadPolls();
      } catch (err) {
        showToast(err.message, 'error');
      }
    });

    if (user) loadPolls();
  </script>
</body>
</html>
