<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Polls &amp; Elections | VidyaSphere</title>
  <meta name="description" content="Vote securely in school elections, classroom surveys, and campus feedback polls with live atomic vote tallies on VidyaSphere.">
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:site_name" content="VidyaSphere">
  <meta property="og:title" content="School Polls &amp; Elections | VidyaSphere">
  <meta property="og:description" content="One-click school voting and classroom polls.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%230b57d0'/><text x='50' y='66' font-size='52' text-anchor='middle' fill='white'>🎓</text></svg>">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0b57d0">
  <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/css/custom.css">
</head>
<body class="bg-[var(--md-surface)] text-[var(--md-on-surface)] min-h-screen flex flex-col md:flex-row pb-20 md:pb-0 w-full">

  <main class="flex-1 w-full max-w-5xl mx-auto p-3.5 sm:p-6 lg:p-8 space-y-5">
    <div class="m3-tonal-box p-5 sm:p-6 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 border border-[var(--md-outline)]">
      <div>
        <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight">School Polls &amp; Elections</h1>
        <p class="text-xs text-[var(--md-on-surface-variant)]">Duplicate-proof student voting, council elections &amp; survey topics</p>
      </div>
      <button id="open-create-poll-btn"
        class="m3-btn-primary w-full sm:w-auto px-5 py-2.5 text-xs flex items-center justify-center gap-2">
        <i data-lucide="plus" class="w-4 h-4"></i> Create Poll
      </button>
    </div>

    <div id="polls-container" class="space-y-4 w-full">
      <div class="m3-card p-8 text-center text-slate-400 text-xs">Loading polls...</div>
    </div>
  </main>

  <!-- Create Poll Modal -->
  <div id="create-poll-modal" class="m3-modal-backdrop fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs hidden items-center justify-center p-4">
    <div class="m3-modal-panel bg-white rounded-[28px] w-full max-w-md p-5 space-y-3.5 shadow-2xl overflow-y-auto max-h-[90vh] modal-enter">
      <div class="m3-sheet-handle sm:hidden"></div>
      <div class="flex items-center justify-between pb-2 border-b border-[var(--md-outline)]">
        <h3 class="text-base font-extrabold">Create a School Poll</h3>
        <button id="close-poll-modal" class="p-1.5 rounded-full hover:bg-slate-100 text-slate-500"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>
      <form id="poll-form" class="space-y-3">
        <div>
          <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1">Poll Question</label>
          <input type="text" id="poll-question" required class="m3-input w-full px-3.5 py-2 rounded-2xl border border-[var(--md-outline)] text-xs sm:text-sm" placeholder="e.g. Topic for the next science exhibition?">
        </div>
        <div class="space-y-2" id="poll-options-list">
          <div class="flex items-center justify-between">
            <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500">Options (Min 2)</label>
            <button type="button" id="add-poll-option-btn" class="text-[11px] font-bold text-[var(--md-primary)] hover:underline">+ Add Option</button>
          </div>
          <input type="text" class="poll-option-input m3-input w-full px-3.5 py-2 rounded-2xl border border-[var(--md-outline)] text-xs sm:text-sm" placeholder="Option 1" required>
          <input type="text" class="poll-option-input m3-input w-full px-3.5 py-2 rounded-2xl border border-[var(--md-outline)] text-xs sm:text-sm" placeholder="Option 2" required>
          <input type="text" class="poll-option-input m3-input w-full px-3.5 py-2 rounded-2xl border border-[var(--md-outline)] text-xs sm:text-sm" placeholder="Option 3 (Optional)">
        </div>
        <div>
          <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1">Closing Date &amp; Time <span class="font-normal lowercase">(optional)</span></label>
          <input type="datetime-local" id="poll-expires" class="m3-input w-full px-3.5 py-2 rounded-2xl border border-[var(--md-outline)] text-xs bg-white">
        </div>
        <button type="submit" class="m3-btn-primary w-full py-3 text-xs sm:text-sm">Launch Poll</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { apiRequest } from '/js/api.js';
    import { initDashboardShell } from '/js/layout.js';
    import { escapeHtml, formatDate, renderRoleBadgeHtml, showToast, initIcons, bindModalBackdropAndEsc } from '/js/ui.js';

    const user = initDashboardShell({ active: 'polls', mobileTitle: 'School Polls' });

    const pollsContainer = document.getElementById('polls-container');
    const createPollModal = document.getElementById('create-poll-modal');
    const closePoll = () => { createPollModal.classList.add('hidden'); createPollModal.classList.remove('flex'); };

    document.getElementById('open-create-poll-btn').addEventListener('click', () => {
      createPollModal.classList.remove('hidden');
      createPollModal.classList.add('flex');
    });
    document.getElementById('close-poll-modal').addEventListener('click', closePoll);
    bindModalBackdropAndEsc(createPollModal, closePoll);

    document.getElementById('add-poll-option-btn').addEventListener('click', () => {
      const list = document.getElementById('poll-options-list');
      const count = list.querySelectorAll('.poll-option-input').length;
      if (count >= 8) {
        showToast('Maximum 8 options allowed', 'warning');
        return;
      }
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'poll-option-input m3-input w-full px-3.5 py-2 rounded-2xl border border-[var(--md-outline)] text-xs sm:text-sm';
      input.placeholder = `Option ${count + 1} (Optional)`;
      list.appendChild(input);
    });

    async function loadPolls() {
      try {
        const res = await apiRequest('/polls');
        const polls = res.polls || [];

        if (polls.length === 0) {
          pollsContainer.innerHTML = `
            <div class="m3-card p-10 text-center text-slate-400">
              <i data-lucide="vote" class="w-8 h-8 mx-auto mb-2 opacity-40"></i>
              <p class="text-sm font-bold text-slate-700">No active polls right now</p>
              <p class="text-xs text-slate-400 mt-1">Teachers, admins, and students can launch polls above.</p>
            </div>
          `;
          initIcons();
          return;
        }

        pollsContainer.innerHTML = polls.map(poll => {
          const hasVoted = poll.userVotedOption !== null;
          const canVote = !hasVoted && !poll.isExpired;
          const canManage = user && (user.id === poll.creatorId || user.role === 'admin');

          return `
            <article class="m3-card p-5 sm:p-6 space-y-3.5 w-full break-words">
              <div class="flex items-start justify-between flex-wrap gap-2">
                <div>
                  <h3 class="text-base sm:text-lg font-extrabold leading-snug">${escapeHtml(poll.question)}</h3>
                  <p class="text-[11px] text-slate-500 mt-1 flex items-center gap-1.5 flex-wrap tabular-nums">
                    <span>By <strong>${escapeHtml(poll.creatorName || 'School')}</strong></span>
                    ${renderRoleBadgeHtml(poll.creatorRole, poll.creatorTeacherType, poll.creatorIsRootAdmin)}
                    <span>• ${poll.totalVotes} vote${poll.totalVotes === 1 ? '' : 's'}</span>
                  </p>
                </div>
                <div class="flex items-center gap-1.5">
                  ${poll.isExpired ? '<span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase bg-slate-100 text-slate-600">Closed</span>' : ''}
                  ${hasVoted ? '<span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase bg-emerald-100 text-emerald-800">Voted</span>' : ''}
                  ${canManage && !poll.isExpired ? `<button class="close-poll-btn px-2.5 py-1 rounded-full bg-amber-50 hover:bg-amber-100 text-amber-800 font-bold text-[10px]" data-id="${escapeHtml(poll.id)}">Close</button>` : ''}
                  ${canManage ? `<button class="del-poll-btn p-1.5 rounded-full text-slate-400 hover:text-rose-600 hover:bg-rose-50 transition" data-id="${escapeHtml(poll.id)}" title="Delete Poll"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>` : ''}
                </div>
              </div>

              <div class="space-y-2">
                ${poll.options.map(opt => {
                  const isUserSelection = poll.userVotedOption === opt.index;
                  return `
                    <div class="relative overflow-hidden rounded-2xl border ${isUserSelection ? 'border-[var(--md-primary)] ring-2 ring-[var(--md-ring)]' : 'border-[var(--md-outline)]'} p-3 transition">
                      <div class="absolute inset-y-0 left-0 ${isUserSelection ? 'bg-[var(--md-primary-container)]/75' : 'bg-[var(--md-surface-container)]'} transition-all duration-500" style="width: ${opt.percentage}%"></div>
                      <div class="relative z-10 flex items-center justify-between gap-2">
                        <div class="flex items-center gap-2.5 overflow-hidden">
                          ${canVote ? `
                            <button class="vote-action-btn w-5 h-5 rounded-full border-2 border-slate-400 hover:border-[var(--md-primary)] flex items-center justify-center shrink-0 transition"
                              data-poll-id="${escapeHtml(poll.id)}" data-opt-idx="${opt.index}" title="Cast Vote">
                              <span class="w-2.5 h-2.5 rounded-full bg-[var(--md-primary)] opacity-0 hover:opacity-100"></span>
                            </button>
                          ` : (isUserSelection ? '<i data-lucide="check-circle" class="w-4 h-4 text-[var(--md-primary)] shrink-0"></i>' : '')}
                          <span class="text-xs sm:text-sm font-bold break-words">${escapeHtml(opt.label)}</span>
                        </div>
                        <span class="text-[11px] sm:text-xs font-extrabold text-[var(--md-on-surface-variant)] shrink-0 tabular-nums">${opt.percentage}% (${opt.votes})</span>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>

              <div class="pt-2 border-t border-[var(--md-outline)] flex items-center justify-between text-[11px] text-slate-400">
                <span>${poll.expiresAt ? 'Ends: ' + escapeHtml(formatDate(poll.expiresAt)) : 'Open Poll'}</span>
                <span>${hasVoted ? 'Duplicate votes locked' : (poll.isExpired ? 'Voting ended' : 'Tap circle to cast vote')}</span>
              </div>
            </article>
          `;
        }).join('');

        initIcons();

        pollsContainer.querySelectorAll('.vote-action-btn').forEach(btn => {
          btn.addEventListener('click', async () => {
            try {
              await apiRequest(`/polls/${encodeURIComponent(btn.dataset.pollId)}/vote`, {
                method: 'POST',
                body: { optionIndex: parseInt(btn.dataset.optIdx, 10) },
              });
              showToast('Vote cast successfully!', 'success');
              loadPolls();
            } catch (err) {
              showToast(err.message, 'error');
            }
          });
        });

        pollsContainer.querySelectorAll('.close-poll-btn').forEach(btn => {
          btn.addEventListener('click', async () => {
            if (!confirm('Close voting for this poll early?')) return;
            try {
              await apiRequest(`/polls/${encodeURIComponent(btn.dataset.id)}/close`, { method: 'POST' });
              showToast('Poll closed', 'info');
              loadPolls();
            } catch (err) {
              showToast(err.message, 'error');
            }
          });
        });

        pollsContainer.querySelectorAll('.del-poll-btn').forEach(btn => {
          btn.addEventListener('click', async () => {
            if (!confirm('Permanently delete this poll and its votes?')) return;
            try {
              await apiRequest(`/polls/${encodeURIComponent(btn.dataset.id)}`, { method: 'DELETE' });
              showToast('Poll deleted', 'info');
              loadPolls();
            } catch (err) {
              showToast(err.message, 'error');
            }
          });
        });
      } catch (err) {
        pollsContainer.innerHTML = `<div class="m3-card p-6 text-center text-rose-600 text-xs">${escapeHtml(err.message)}</div>`;
      }
    }

    document.getElementById('poll-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const question = document.getElementById('poll-question').value.trim();
      const options = Array.from(document.querySelectorAll('.poll-option-input')).map(i => i.value.trim()).filter(Boolean);
      const expiresAtVal = document.getElementById('poll-expires').value;
      if (options.length < 2) {
        showToast('Please provide at least 2 options', 'error');
        return;
      }
      try {
        await apiRequest('/polls', {
          method: 'POST',
          body: { question, options, expiresAt: expiresAtVal || null }
        });
        showToast('Poll created successfully!', 'success');
        closePoll();
        e.target.reset();
        loadPolls();
      } catch (err) {
        showToast(err.message, 'error');
      }
    });

    if (user) loadPolls();
  </script>
</body>
</html>
