<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Directory | VidyaSphere</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0b57d0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/css/custom.css">
</head>
<body class="bg-[var(--md-surface)] text-[var(--md-on-surface)] min-h-screen flex flex-col md:flex-row pb-20 md:pb-0 w-full">

  <main class="flex-1 w-full max-w-5xl mx-auto p-3.5 sm:p-6 lg:p-8 space-y-5">
    <div class="m3-tonal-box p-5 flex items-center justify-between gap-2 border border-[var(--md-outline)]">
      <div>
        <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight">School Directory</h1>
        <p class="text-xs text-[var(--md-on-surface-variant)]">Verified active students, teachers &amp; admins</p>
      </div>
      <span id="roster-count" class="text-xs font-bold bg-white border border-[var(--md-outline)] px-3 py-1 rounded-full tabular-nums"></span>
    </div>

    <div class="m3-card p-3.5 grid grid-cols-1 sm:grid-cols-3 gap-2.5 w-full">
      <div class="relative">
        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
          <i data-lucide="search" class="w-4 h-4"></i>
        </span>
        <input type="text" id="search-input"
          class="m3-input w-full pl-9 pr-3 py-2 rounded-full border border-[var(--md-outline)] bg-[var(--md-surface)] text-xs sm:text-sm"
          placeholder="Search name, @username, or roll #...">
      </div>
      <select id="role-filter" class="m3-input px-3.5 py-2 rounded-full border border-[var(--md-outline)] text-xs sm:text-sm bg-white">
        <option value="">All Members</option>
        <option value="student">Students</option>
        <option value="teacher">Teachers / Faculty</option>
        <option value="admin">Admins</option>
      </select>
      <select id="class-filter" class="m3-input px-3.5 py-2 rounded-full border border-[var(--md-outline)] text-xs sm:text-sm bg-white">
        <option value="">All Classes (1st - 12th)</option>
      </select>
    </div>

    <div id="students-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3.5 w-full">
      <div class="col-span-full m3-card p-8 text-center text-slate-400 text-xs">Loading directory...</div>
    </div>
  </main>

  <script type="module">
    import { apiRequest } from '/js/api.js';
    import { initDashboardShell } from '/js/layout.js';
    import { CLASS_LIST, escapeHtml, renderRoleBadgeHtml, formatMemberSubline, isRootUser, showToast, initIcons } from '/js/ui.js';

    const user = initDashboardShell({ active: 'students', mobileTitle: 'Directory' });

    const searchInput = document.getElementById('search-input');
    const roleFilter = document.getElementById('role-filter');
    const classFilter = document.getElementById('class-filter');
    const container = document.getElementById('students-container');
    const rosterCount = document.getElementById('roster-count');

    CLASS_LIST.forEach(c => { classFilter.innerHTML += `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`; });

    async function loadStudents() {
      const params = new URLSearchParams();
      if (searchInput.value.trim()) params.append('search', searchInput.value.trim());
      if (classFilter.value) params.append('className', classFilter.value);
      if (roleFilter.value) params.append('role', roleFilter.value);

      try {
        const res = await apiRequest(`/students?${params.toString()}`);
        const list = res.students || [];
        rosterCount.textContent = `${list.length} active`;

        if (list.length === 0) {
          container.innerHTML = `<div class="col-span-full m3-card p-10 text-center text-slate-400 text-xs">No matching school members found.</div>`;
          return;
        }

        container.innerHTML = list.map(member => {
          const isRoot = isRootUser(member);
          const isAdmin = isRoot || member.role === 'admin';
          const isTeacher = member.role === 'teacher';
          const initial = (member.full_name || 'S').charAt(0).toUpperCase();
          const subline = formatMemberSubline(member);
          const isMe = user && member.id === user.id;
          const dmsBlocked = isTeacher && member.allow_student_dms === 0 && user?.role === 'student';

          return `
            <div class="m3-card m3-card-interactive p-4 flex items-center justify-between gap-2.5 w-full break-words">
              <div class="flex items-center gap-3 overflow-hidden flex-1">
                <div class="w-10 h-10 rounded-2xl ${isAdmin ? 'bg-amber-100 text-amber-900' : (isTeacher ? 'bg-[var(--md-primary-container)] text-[var(--md-on-primary-container)]' : 'bg-[var(--md-surface-container)] text-[var(--md-primary)]')} font-extrabold flex items-center justify-center shrink-0 text-sm">
                  ${escapeHtml(initial)}
                </div>
                <div class="overflow-hidden flex-1">
                  <div class="flex items-center gap-1.5 flex-wrap">
                    <h4 class="font-bold text-xs sm:text-sm truncate">${escapeHtml(member.full_name)}</h4>
                    ${renderRoleBadgeHtml(member.role, member.teacher_type, isRoot)}
                  </div>
                  <p class="text-[11px] text-[var(--md-primary)] font-mono font-medium truncate">@${escapeHtml(member.username)}</p>
                  <div class="text-[11px] text-slate-500 mt-0.5 tabular-nums truncate">${escapeHtml(subline)}</div>
                </div>
              </div>
              ${!isMe ? (dmsBlocked ? `
                <span class="px-2.5 py-1 rounded-full bg-slate-100 text-slate-500 font-bold text-[10px] shrink-0">DMs Off</span>
              ` : `
                <button type="button" class="dir-dm-btn m3-btn-tonal p-2 shrink-0" title="Start Direct Chat" data-id="${escapeHtml(member.id)}">
                  <i data-lucide="message-circle" class="w-4 h-4"></i>
                </button>
              `) : ''}
            </div>
          `;
        }).join('');

        initIcons();

        container.querySelectorAll('.dir-dm-btn').forEach(btn => {
          btn.addEventListener('click', async () => {
            try {
              btn.disabled = true;
              const res = await apiRequest('/chat/dms/request', { method: 'POST', body: { targetUserId: btn.dataset.id } });
              window.location.href = `/dashboard/chat.html?dm=${encodeURIComponent(res.id)}`;
            } catch (err) {
              showToast(err.message, 'error');
              btn.disabled = false;
            }
          });
        });
      } catch (err) {
        container.innerHTML = `<div class="col-span-full p-6 text-center text-rose-600 bg-rose-50 rounded-3xl text-xs">${escapeHtml(err.message)}</div>`;
      }
    }

    searchInput.addEventListener('input', () => { clearTimeout(window._searchTimer); window._searchTimer = setTimeout(loadStudents, 300); });
    roleFilter.addEventListener('change', loadStudents);
    classFilter.addEventListener('change', loadStudents);

    if (user) loadStudents();
  </script>
</body>
</html>
