<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lessons &amp; Quizzes | VidyaSphere Academic Portal</title>
  <meta name="description" content="Explore chapter lessons, syllabus outlines, PDFs, and timed auto-graded MCQ quizzes published by teachers on VidyaSphere.">
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:site_name" content="VidyaSphere">
  <meta property="og:title" content="Lessons &amp; Quizzes | VidyaSphere">
  <meta property="og:description" content="Interactive chapter lessons and auto-graded MCQ quizzes for VidyaSphere students.">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon.png">
  <link rel="shortcut icon" type="image/png" href="/icon.png">
  <link rel="apple-touch-icon" href="/icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0b57d0">
  <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/css/custom.css">
</head>
<body class="bg-[var(--md-surface)] text-[var(--md-on-surface)] min-h-screen flex flex-col md:flex-row pb-20 md:pb-0 w-full">

  <main class="flex-1 w-full max-w-5xl mx-auto p-3.5 sm:p-6 lg:p-8 space-y-5">
    <div class="m3-tonal-box p-5 sm:p-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4 border border-[var(--md-outline)]">
      <div>
        <span class="px-3 py-1 rounded-full bg-[var(--md-primary-container)] text-[var(--md-on-primary-container)] text-[10px] font-bold uppercase tracking-wider inline-block mb-1.5">
          Faculty Learning Hub
        </span>
        <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight">Chapter Lessons &amp; 5-Min Quizzes</h1>
        <p class="text-xs text-[var(--md-on-surface-variant)]">Watch teacher lessons on demand (data-saver) &amp; test yourself with instant auto-graded MCQs.</p>
      </div>
      <!-- Material 3 Segmented Button Switch -->
      <div class="inline-flex p-1 rounded-full bg-white border border-[var(--md-outline)] shrink-0 self-start sm:self-center">
        <button id="seg-lessons" class="px-4 py-2 rounded-full text-xs font-bold bg-[var(--md-secondary-container)] text-[var(--md-on-secondary-container)] transition">Lessons</button>
        <button id="seg-quizzes" class="px-4 py-2 rounded-full text-xs font-semibold text-[var(--md-on-surface-variant)] transition">5-Min Quizzes</button>
      </div>
    </div>

    <!-- Filters -->
    <div class="m3-card p-3.5 space-y-2.5">
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
        <div class="relative">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
          <input type="text" id="learn-search" placeholder="Search chapter or topic..."
            class="m3-input w-full pl-9 pr-3 py-2 rounded-full border border-[var(--md-outline)] bg-[var(--md-surface)] text-xs">
        </div>
        <select id="learn-class-filter" class="m3-input px-3.5 py-2 rounded-full border border-[var(--md-outline)] text-xs font-semibold bg-white">
          <option value="">All Classes</option>
        </select>
        <select id="learn-subject-filter" class="m3-input px-3.5 py-2 rounded-full border border-[var(--md-outline)] text-xs font-semibold bg-white">
          <option value="">All Subjects</option>
        </select>
      </div>
      <div id="quizzes-filter-bar" class="hidden pt-2 border-t border-[var(--md-outline)] flex items-center justify-between">
        <button type="button" id="unattempted-only-chip" class="m3-chip px-3.5 py-1 text-[11px] font-semibold">Unattempted Only</button>
        <span id="learn-count-label" class="text-[11px] text-[var(--md-on-surface-variant)] font-semibold tabular-nums"></span>
      </div>
    </div>

    <!-- Lessons Grid -->
    <div id="lessons-view" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="col-span-full m3-card p-8 text-center text-xs text-slate-400">Loading chapter lessons...</div>
    </div>

    <!-- Quizzes Grid -->
    <div id="quizzes-view" class="hidden grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="col-span-full m3-card p-8 text-center text-xs text-slate-400">Loading quizzes...</div>
    </div>
  </main>

  <!-- Interactive Quiz Player Modal -->
  <div id="quiz-player-modal" class="m3-modal-backdrop fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs hidden items-center justify-center p-4">
    <div class="m3-modal-panel bg-white rounded-[28px] w-full max-w-2xl p-5 space-y-4 shadow-2xl max-h-[90vh] flex flex-col overflow-hidden modal-enter">
      <div class="m3-sheet-handle sm:hidden shrink-0"></div>
      <div class="flex items-center justify-between pb-2 border-b border-slate-100 shrink-0">
        <div>
          <h3 id="qp-title" class="text-base font-extrabold">Quick Quiz</h3>
          <p id="qp-meta" class="text-[11px] text-slate-500"></p>
        </div>
        <button id="close-qp-modal" class="p-2 rounded-full hover:bg-slate-100 text-slate-500"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>
      <div id="qp-body" class="flex-1 overflow-y-auto space-y-3 pr-1"></div>
      <div id="qp-footer" class="pt-3 border-t border-slate-100 shrink-0 flex justify-end gap-2"></div>
    </div>
  </div>

  <script type="module">
    import { apiRequest } from '/js/api.js';
    import { initDashboardShell } from '/js/layout.js';
    import { CLASS_LIST, SUBJECT_LIST, escapeHtml, safeUrl, formatDate, extractYouTubeId, renderRoleBadgeHtml, showToast, initIcons, bindModalBackdropAndEsc } from '/js/ui.js';

    const user = initDashboardShell({ active: 'lessons', mobileTitle: 'Lessons & Quizzes' });
    const classFilter = document.getElementById('learn-class-filter');
    const subjectFilter = document.getElementById('learn-subject-filter');
    const searchInput = document.getElementById('learn-search');
    const lessonsView = document.getElementById('lessons-view');
    const quizzesView = document.getElementById('quizzes-view');
    const quizzesFilterBar = document.getElementById('quizzes-filter-bar');
    const unattemptedChip = document.getElementById('unattempted-only-chip');
    const countLabel = document.getElementById('learn-count-label');

    if (user?.className) {
      const opt = document.createElement('option');
      opt.value = user.className;
      opt.textContent = `My Class (${user.className})`;
      classFilter.appendChild(opt);
    }
    CLASS_LIST.forEach(c => {
      if (c !== user?.className) {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        classFilter.appendChild(opt);
      }
    });
    SUBJECT_LIST.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s;
      opt.textContent = s;
      subjectFilter.appendChild(opt);
    });

    let activeMode = 'lessons';
    let unattemptedOnly = false;

    unattemptedChip.addEventListener('click', () => {
      unattemptedOnly = !unattemptedOnly;
      unattemptedChip.classList.toggle('active', unattemptedOnly);
      loadContent();
    });

    document.getElementById('seg-lessons').addEventListener('click', () => {
      activeMode = 'lessons';
      document.getElementById('seg-lessons').className = 'px-4 py-2 rounded-full text-xs font-bold bg-[var(--md-secondary-container)] text-[var(--md-on-secondary-container)] transition';
      document.getElementById('seg-quizzes').className = 'px-4 py-2 rounded-full text-xs font-semibold text-[var(--md-on-surface-variant)] transition';
      lessonsView.classList.remove('hidden');
      quizzesView.classList.add('hidden');
      quizzesFilterBar.classList.add('hidden');
      loadContent();
    });
    document.getElementById('seg-quizzes').addEventListener('click', () => {
      activeMode = 'quizzes';
      document.getElementById('seg-quizzes').className = 'px-4 py-2 rounded-full text-xs font-bold bg-[var(--md-secondary-container)] text-[var(--md-on-secondary-container)] transition';
      document.getElementById('seg-lessons').className = 'px-4 py-2 rounded-full text-xs font-semibold text-[var(--md-on-surface-variant)] transition';
      quizzesView.classList.remove('hidden');
      lessonsView.classList.add('hidden');
      quizzesFilterBar.classList.remove('hidden');
      loadContent();
    });

    async function loadContent() {
      const params = new URLSearchParams();
      if (classFilter.value) params.append('className', classFilter.value);
      if (subjectFilter.value) params.append('subject', subjectFilter.value);
      if (searchInput.value.trim()) params.append('search', searchInput.value.trim());

      if (activeMode === 'lessons') {
        try {
          const res = await apiRequest(`/lessons?${params.toString()}`);
          const list = res.lessons || [];
          if (list.length === 0) {
            lessonsView.innerHTML = `<div class="col-span-full m3-card p-10 text-center text-xs text-slate-400">No chapter lessons published for this filter yet.</div>`;
            return;
          }
          lessonsView.innerHTML = list.map(les => {
            const ytId = extractYouTubeId(les.video_url);
            const safeVideo = safeUrl(les.video_url);
            const safeRes = safeUrl(les.resource_url);
            return `
              <article class="m3-card p-5 space-y-3 flex flex-col justify-between">
                <div class="space-y-2">
                  <div class="flex items-center justify-between flex-wrap gap-1.5">
                    <div class="flex items-center gap-1.5 flex-wrap">
                      <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-[var(--md-primary-container)] text-[var(--md-on-primary-container)]">${escapeHtml(les.class_name)}</span>
                      <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-slate-100 text-slate-700">${escapeHtml(les.subject)}</span>
                    </div>
                    ${renderRoleBadgeHtml(les.teacher_role || 'teacher', les.teacher_type, les.teacher_is_root_admin === 1)}
                  </div>
                  <h3 class="text-base font-extrabold leading-snug">${escapeHtml(les.title)}</h3>
                  ${les.chapter ? `<p class="text-xs font-bold text-[var(--md-primary)]">${escapeHtml(les.chapter)}</p>` : ''}
                  ${les.summary ? `<p class="text-xs text-[var(--md-on-surface-variant)] whitespace-pre-line leading-relaxed">${escapeHtml(les.summary)}</p>` : ''}
                  ${ytId ? `
                    <div class="yt-lazy-box rounded-2xl overflow-hidden bg-slate-900 text-white p-4 flex items-center justify-between gap-3" data-yt-id="${escapeHtml(ytId)}">
                      <div class="flex items-center gap-2.5">
                        <span class="w-9 h-9 rounded-full bg-rose-600 flex items-center justify-center shrink-0"><i data-lucide="play" class="w-4 h-4"></i></span>
                        <div><p class="text-xs font-bold">Tap to Load Video Lesson</p><p class="text-[10px] text-slate-300">Data-saver mode • Loads only on tap</p></div>
                      </div>
                      <button type="button" class="play-yt-btn px-3 py-1.5 rounded-full bg-white text-slate-900 font-bold text-xs shrink-0">Watch</button>
                    </div>
                  ` : ''}
                </div>
                <div class="pt-3 border-t border-slate-100 flex items-center justify-between gap-2 text-xs">
                  <span class="text-[11px] text-slate-500">By <strong>${escapeHtml(les.teacher_name || 'Faculty')}</strong> • ${escapeHtml(formatDate(les.created_at))}</span>
                  <div class="flex gap-2">
                    ${safeVideo && !ytId ? `<a href="${escapeHtml(safeVideo)}" target="_blank" rel="noopener noreferrer" class="m3-btn-tonal px-3 py-1.5 text-[11px]">Open Video</a>` : ''}
                    ${safeRes ? `<a href="${escapeHtml(safeRes)}" target="_blank" rel="noopener noreferrer" class="m3-btn-primary px-3 py-1.5 text-[11px] inline-flex items-center gap-1"><i data-lucide="file-text" class="w-3 h-3"></i> Notes PDF</a>` : ''}
                  </div>
                </div>
              </article>
            `;
          }).join('');

          initIcons();
          lessonsView.querySelectorAll('.play-yt-btn').forEach(btn => {
            btn.addEventListener('click', () => {
              const box = btn.closest('.yt-lazy-box');
              const ytId = box.dataset.ytId;
              box.className = 'rounded-2xl overflow-hidden aspect-video bg-black';
              box.innerHTML = `<iframe class="w-full h-full" src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(ytId)}?autoplay=1" title="Lesson Video" frameborder="0" allow="accelerometer; autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
            });
          });
        } catch (err) {
          lessonsView.innerHTML = `<div class="col-span-full m3-card p-6 text-rose-600 text-xs">${escapeHtml(err.message)}</div>`;
        }
      } else {
        try {
          const res = await apiRequest(`/quizzes?${params.toString()}`);
          let list = res.quizzes || [];
          const searchQ = searchInput.value.trim().toLowerCase();
          if (searchQ) {
            list = list.filter(q => (q.title || '').toLowerCase().includes(searchQ) || (q.chapter || '').toLowerCase().includes(searchQ));
          }
          if (unattemptedOnly) {
            list = list.filter(q => !q.myAttempt);
          }
          countLabel.textContent = `${list.length} quiz${list.length === 1 ? '' : 'zes'}`;

          if (list.length === 0) {
            quizzesView.innerHTML = `<div class="col-span-full m3-card p-10 text-center text-xs text-slate-400">No quizzes available right now.</div>`;
            return;
          }
          quizzesView.innerHTML = list.map(q => `
            <article class="m3-card p-5 space-y-3 flex flex-col justify-between">
              <div class="space-y-1.5">
                <div class="flex items-center justify-between gap-2 flex-wrap">
                  <div class="flex items-center gap-1.5 flex-wrap">
                    <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-purple-100 text-purple-800">${escapeHtml(q.className)} • ${escapeHtml(q.subject)}</span>
                    ${renderRoleBadgeHtml(q.teacherRole || 'teacher', q.teacherType, q.teacherIsRootAdmin)}
                  </div>
                  ${q.myAttempt ? `<span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800 tabular-nums">Score: ${q.myAttempt.score}/${q.myAttempt.total}</span>` : `<span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-amber-100 text-amber-800 tabular-nums">${q.questionCount} MCQs</span>`}
                </div>
                <h3 class="text-base font-extrabold">${escapeHtml(q.title)}</h3>
                <p class="text-[11px] text-slate-500">By ${escapeHtml(q.teacherName || 'Teacher')} ${q.chapter ? '• ' + escapeHtml(q.chapter) : ''} • ${q.attemptCount || 0} attempts</p>
              </div>
              <button class="start-quiz-btn ${q.myAttempt ? 'm3-btn-tonal' : 'm3-btn-primary'} w-full py-2.5 text-xs" data-id="${escapeHtml(q.id)}">
                ${q.myAttempt ? 'Review Answer Key' : 'Start 5-Min Quiz'}
              </button>
            </article>
          `).join('');
          quizzesView.querySelectorAll('.start-quiz-btn').forEach(btn => {
            btn.addEventListener('click', () => openQuizPlayer(btn.dataset.id));
          });
        } catch (err) {
          quizzesView.innerHTML = `<div class="col-span-full m3-card p-6 text-rose-600 text-xs">${escapeHtml(err.message)}</div>`;
        }
      }
    }

    const qpModal = document.getElementById('quiz-player-modal');
    const closeQp = () => { qpModal.classList.add('hidden'); qpModal.classList.remove('flex'); };
    document.getElementById('close-qp-modal').addEventListener('click', closeQp);
    bindModalBackdropAndEsc(qpModal, closeQp);

    async function openQuizPlayer(quizId) {
      try {
        const res = await apiRequest(`/quizzes/${encodeURIComponent(quizId)}`);
        const qz = res.quiz;
        document.getElementById('qp-title').textContent = qz.title;
        document.getElementById('qp-meta').textContent = `${qz.className} • ${qz.subject} • By ${qz.teacherName || 'Teacher'}`;
        const bodyEl = document.getElementById('qp-body');
        const footerEl = document.getElementById('qp-footer');

        if (qz.myAttempt) {
          renderQuizReview(bodyEl, footerEl, qz.questions.map((q, idx) => ({
            ...q,
            selectedIndex: qz.myAttempt.selectedAnswers[idx],
            isCorrect: qz.myAttempt.selectedAnswers[idx] === q.correctIndex,
          })), qz.myAttempt.score, qz.myAttempt.total);
        } else {
          bodyEl.innerHTML = qz.questions.map((q, idx) => `
            <div class="p-4 rounded-2xl bg-[var(--md-surface-container)] space-y-2.5">
              <p class="font-bold text-xs sm:text-sm">Q${idx + 1}. ${escapeHtml(q.question)}</p>
              <div class="space-y-1.5">
                ${q.options.map((opt, oIdx) => `
                  <label class="flex items-center gap-2.5 p-2.5 rounded-xl bg-white border border-[var(--md-outline)] cursor-pointer hover:border-[var(--md-primary)] text-xs">
                    <input type="radio" name="qp-q-${idx}" value="${oIdx}">
                    <span>${escapeHtml(opt)}</span>
                  </label>
                `).join('')}
              </div>
            </div>
          `).join('');

          footerEl.innerHTML = `<button id="submit-quiz-btn" class="m3-btn-primary px-6 py-2.5 text-xs">Submit &amp; Auto-Grade</button>`;
          const submitBtn = document.getElementById('submit-quiz-btn');
          submitBtn.addEventListener('click', async () => {
            const answers = qz.questions.map((_, idx) => {
              const checked = document.querySelector(`input[name="qp-q-${idx}"]:checked`);
              return checked ? Number(checked.value) : -1;
            });
            if (answers.some(a => a < 0)) {
              showToast('Please select an answer for every question', 'warning');
              return;
            }
            try {
              submitBtn.disabled = true;
              submitBtn.textContent = 'Grading...';
              const out = await apiRequest(`/quizzes/${encodeURIComponent(quizId)}/attempt`, {
                method: 'POST',
                body: { answers }
              });
              showToast(`Scored ${out.score}/${out.total} (${out.percentage}%)!`, 'success');
              renderQuizReview(bodyEl, footerEl, out.review, out.score, out.total);
              loadContent();
            } catch (err) {
              showToast(err.message, 'error');
              submitBtn.disabled = false;
              submitBtn.textContent = 'Submit & Auto-Grade';
            }
          });
        }
        qpModal.classList.remove('hidden');
        qpModal.classList.add('flex');
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    function renderQuizReview(bodyEl, footerEl, review, score, total) {
      const pct = total > 0 ? Math.round((score / total) * 100) : 0;
      bodyEl.innerHTML = `
        <div class="p-4 rounded-2xl bg-[var(--md-primary-container)] text-[var(--md-on-primary-container)] flex items-center justify-between">
          <div><p class="text-xs font-bold uppercase">Final Score</p><p class="text-2xl font-extrabold tabular-nums">${score} / ${total} (${pct}%)</p></div>
          <span class="px-3 py-1 rounded-full bg-white text-xs font-bold">Auto-Graded</span>
        </div>
        ${review.map((r, idx) => `
          <div class="p-4 rounded-2xl border ${r.isCorrect ? 'bg-emerald-50/70 border-emerald-200' : 'bg-rose-50/70 border-rose-200'} space-y-1.5 text-xs">
            <p class="font-bold">Q${idx + 1}. ${escapeHtml(r.question)}</p>
            <p>Your answer: <strong>${escapeHtml(r.options[r.selectedIndex] ?? '-')}</strong> ${r.isCorrect ? '✅' : '❌'}</p>
            ${!r.isCorrect ? `<p class="text-emerald-800">Correct answer: <strong>${escapeHtml(r.options[r.correctIndex] ?? '')}</strong></p>` : ''}
            ${r.explanation ? `<p class="text-[11px] text-slate-600 pt-1">💡 ${escapeHtml(r.explanation)}</p>` : ''}
          </div>
        `).join('')}
      `;
      footerEl.innerHTML = `<button type="button" id="qp-done-btn" class="m3-btn-tonal px-5 py-2 text-xs">Done</button>`;
      document.getElementById('qp-done-btn').addEventListener('click', closeQp);
    }

    classFilter.addEventListener('change', loadContent);
    subjectFilter.addEventListener('change', loadContent);
    searchInput.addEventListener('input', () => {
      clearTimeout(window._learnSearchTimer);
      window._learnSearchTimer = setTimeout(loadContent, 250);
    });

    if (user) loadContent();
  </script>
</body>
</html>
