<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>School Hub | VidyaSphere</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0b57d0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/css/custom.css">
</head>
<body class="bg-[var(--md-surface)] text-[var(--md-on-surface)] min-h-screen flex flex-col md:flex-row pb-20 md:pb-0 w-full">

  <main class="flex-1 w-full max-w-5xl mx-auto p-3.5 sm:p-6 lg:p-8 space-y-5">
    <!-- Material You Hero Welcome Card -->
    <div class="m3-tonal-box p-5 sm:p-6 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 border border-[var(--md-outline)]">
      <div class="space-y-1.5">
        <span class="px-3 py-1 rounded-full bg-[var(--md-primary-container)] text-[var(--md-on-primary-container)] text-[10px] font-bold uppercase tracking-wider inline-block">
          Official School Hub
        </span>
        <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight truncate" id="welcome-title">Welcome</h1>
        <p class="text-[var(--md-on-surface-variant)] text-xs sm:text-sm">Notice board, academic pulse, upcoming exams, and school circulars.</p>
      </div>
      <div class="flex items-center gap-2 shrink-0 w-full sm:w-auto flex-wrap">
        <a href="/dashboard/lessons.html" class="m3-btn-tonal flex-1 sm:flex-none px-4 py-2.5 text-xs inline-flex items-center justify-center gap-1.5">
          <i data-lucide="play-circle" class="w-4 h-4"></i> Lessons &amp; Quizzes
        </a>
        <a href="/dashboard/notes.html" class="m3-btn-primary flex-1 sm:flex-none px-4 py-2.5 text-xs inline-flex items-center justify-center gap-1.5">
          <i data-lucide="book-open" class="w-4 h-4"></i> Browse Notes
        </a>
      </div>
    </div>

    <!-- Academic Pulse Quick Glance -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
      <a href="/dashboard/exams.html" class="m3-card m3-card-interactive p-3.5 block">
        <p class="text-[11px] font-bold text-[var(--md-on-surface-variant)]">Upcoming Exams</p>
        <p id="pulse-exams" class="text-xl font-extrabold text-purple-700 mt-0.5 tabular-nums">-</p>
      </a>
      <a href="/dashboard/homework.html" class="m3-card m3-card-interactive p-3.5 block">
        <p class="text-[11px] font-bold text-[var(--md-on-surface-variant)]">Class Homework</p>
        <p id="pulse-hw" class="text-xl font-extrabold text-amber-700 mt-0.5 tabular-nums">-</p>
      </a>
      <a href="/dashboard/lessons.html" class="m3-card m3-card-interactive p-3.5 block">
        <p class="text-[11px] font-bold text-[var(--md-on-surface-variant)]">5-Min Quizzes</p>
        <p id="pulse-quizzes" class="text-xl font-extrabold text-[var(--md-primary)] mt-0.5 tabular-nums">-</p>
      </a>
      <a href="/dashboard/polls.html" class="m3-card m3-card-interactive p-3.5 block">
        <p class="text-[11px] font-bold text-[var(--md-on-surface-variant)]">Open Polls</p>
        <p id="pulse-polls" class="text-xl font-extrabold text-emerald-700 mt-0.5 tabular-nums">-</p>
      </a>
    </div>

    <!-- Material 3 Filter Chips -->
    <div class="w-full flex items-center justify-between gap-2 overflow-x-auto no-scrollbar py-0.5">
      <div class="flex items-center gap-2 shrink-0">
        <button data-filter="all" class="filter-pill m3-chip active px-4 py-1.5 text-xs">All Circulars</button>
        <button data-filter="my_class" id="my-class-notice-chip" class="hidden filter-pill m3-chip px-4 py-1.5 text-xs font-semibold">My Class</button>
        <button data-filter="urgent" class="filter-pill m3-chip px-4 py-1.5 text-xs font-semibold">Urgent</button>
        <button data-filter="exam" class="filter-pill m3-chip px-4 py-1.5 text-xs font-semibold">Exams</button>
        <button data-filter="holiday" class="filter-pill m3-chip px-4 py-1.5 text-xs font-semibold">Holidays</button>
      </div>
      <span id="ann-count" class="text-xs text-[var(--md-on-surface-variant)] font-semibold shrink-0 tabular-nums"></span>
    </div>

    <div id="announcements-container" class="space-y-3 w-full">
      <div class="m3-card p-8 text-center text-slate-400 text-xs">Loading announcements...</div>
    </div>
  </main>

  <script type="module">
    import { apiRequest } from '/js/api.js';
    import { initDashboardShell } from '/js/layout.js';
    import { escapeHtml, formatDate, renderRoleBadgeHtml, initIcons, showToast } from '/js/ui.js';

    const user = initDashboardShell({ active: 'notices', mobileTitle: 'Notice Board' });
    if (user) {
      document.getElementById('welcome-title').textContent = `Hello, ${user.fullName || user.username}`;
      if (user.className) {
        const chip = document.getElementById('my-class-notice-chip');
        chip?.classList.remove('hidden');
        chip.textContent = user.className;
      }
    }

    let allAnnouncements = [];
    let currentFilter = 'all';

    async function loadAcademicPulse() {
      const clsParam = user?.className ? `?class=${encodeURIComponent(user.className)}` : '';
      const clsNameParam = user?.className ? `?className=${encodeURIComponent(user.className)}` : '';
      const todayIso = new Date().toISOString().slice(0, 10);

      const [examsRes, hwRes, qzRes, pollsRes] = await Promise.allSettled([
        apiRequest(`/exams${clsParam}`),
        apiRequest(`/homework${clsNameParam}`),
        apiRequest(`/quizzes${clsNameParam}`),
        apiRequest('/polls'),
      ]);

      const exams = examsRes.status === 'fulfilled' ? (examsRes.value.exams || []).filter(e => e.exam_date >= todayIso) : [];
      const hw = hwRes.status === 'fulfilled' ? (hwRes.value.homework || []) : [];
      const qz = qzRes.status === 'fulfilled' ? (qzRes.value.quizzes || []) : [];
      const polls = pollsRes.status === 'fulfilled' ? (pollsRes.value.polls || []).filter(p => !p.isExpired) : [];

      document.getElementById('pulse-exams').textContent = exams.length;
      document.getElementById('pulse-hw').textContent = hw.length;
      document.getElementById('pulse-quizzes').textContent = qz.length;
      document.getElementById('pulse-polls').textContent = polls.length;
    }

    async function loadAnnouncements() {
      const container = document.getElementById('announcements-container');
      try {
        const res = await apiRequest('/announcements');
        allAnnouncements = res.announcements || [];
        renderAnnouncements();
      } catch (err) {
        container.innerHTML = `<div class="p-6 text-center text-rose-600 bg-rose-50 rounded-3xl border border-rose-200 text-xs">${escapeHtml(err.message)}</div>`;
      }
    }

    function renderAnnouncements() {
      const container = document.getElementById('announcements-container');
      const countEl = document.getElementById('ann-count');

      let filtered = allAnnouncements;
      if (currentFilter === 'my_class' && user?.className) {
        filtered = allAnnouncements.filter(a => a.target_class === user.className || a.target_class === 'all');
      } else if (currentFilter !== 'all') {
        filtered = allAnnouncements.filter(a => a.priority === currentFilter);
      }

      countEl.textContent = `${filtered.length} notice${filtered.length === 1 ? '' : 's'}`;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="m3-card p-10 text-center text-slate-400">
            <i data-lucide="bell-off" class="w-8 h-8 mx-auto mb-2 opacity-40"></i>
            <p class="text-sm font-bold text-slate-700">No official notices published yet</p>
            <p class="text-xs text-slate-400 mt-1">School administration and teachers will post circulars here.</p>
          </div>
        `;
        initIcons();
        return;
      }

      const priorityColors = {
        urgent: 'bg-rose-100 text-rose-800',
        exam: 'bg-amber-100 text-amber-800',
        holiday: 'bg-purple-100 text-purple-800',
        general: 'bg-[var(--md-primary-container)] text-[var(--md-on-primary-container)]'
      };

      const isAdmin = user?.role === 'admin';
      const isTeacher = user?.role === 'teacher';
      const teacherClasses = new Set([...(user?.assignedClasses || []), ...(user?.teacherType === 'class' && user?.className ? [user.className] : [])]);

      container.innerHTML = filtered.map(ann => {
        const badgeColor = priorityColors[ann.priority] || priorityColors.general;
        const canDelete = isAdmin || (isTeacher && teacherClasses.has(ann.target_class) && (ann.author_role !== 'admin' || ann.author_id === user.id));
        return `
          <article class="m3-card m3-card-interactive p-5 space-y-2.5 w-full break-words ${ann.is_pinned ? 'ring-2 ring-[var(--md-primary)]/20' : ''}">
            <div class="flex items-center justify-between flex-wrap gap-2">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase ${badgeColor}">${escapeHtml(ann.priority)}</span>
                <span class="text-[11px] text-slate-400 tabular-nums">${escapeHtml(formatDate(ann.created_at))}</span>
                ${ann.is_pinned ? '<span class="text-[10px] text-amber-800 font-bold flex items-center gap-0.5 bg-amber-100 px-2.5 py-0.5 rounded-full"><i data-lucide="pin" class="w-3 h-3"></i> Pinned</span>' : ''}
              </div>
              <div class="flex items-center gap-1.5">
                <span class="text-[10px] font-bold text-slate-700 bg-[var(--md-surface-container)] px-2.5 py-0.5 rounded-full">
                  ${ann.target_class === 'all' ? 'All Classes' : escapeHtml(ann.target_class)}
                </span>
                ${canDelete ? `
                  <button class="delete-notice-btn p-1.5 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-full transition"
                    data-id="${escapeHtml(ann.id)}" data-title="${escapeHtml(ann.title)}" title="Delete Notice">
                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                  </button>
                ` : ''}
              </div>
            </div>

            <h3 class="text-base sm:text-lg font-extrabold leading-snug">${escapeHtml(ann.title)}</h3>
            <p class="text-xs sm:text-sm text-[var(--md-on-surface-variant)] leading-relaxed whitespace-pre-line">${escapeHtml(ann.content)}</p>

            <div class="pt-2 border-t border-[var(--md-outline)] flex items-center justify-between flex-wrap gap-2 text-[11px] text-slate-500">
              <span class="flex items-center gap-1.5">
                Published by <strong>${escapeHtml(ann.author_name || 'Admin')}</strong>
                ${renderRoleBadgeHtml(ann.author_role, ann.author_teacher_type, ann.author_is_root_admin === 1)}
              </span>
              ${ann.expires_at ? `<span class="tabular-nums">Auto-deletes ${escapeHtml(formatDate(ann.expires_at))}</span>` : ''}
            </div>
          </article>
        `;
      }).join('');

      initIcons();

      container.querySelectorAll('.delete-notice-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (!confirm(`Delete notice "${btn.dataset.title || 'this notice'}"?`)) return;
          try {
            btn.disabled = true;
            await apiRequest(`/admin/announcements/${encodeURIComponent(btn.dataset.id)}`, { method: 'DELETE' });
            showToast('Notice deleted successfully', 'info');
            loadAnnouncements();
          } catch (err) {
            showToast(err.message, 'error');
            btn.disabled = false;
          }
        });
      });
    }

    document.querySelectorAll('.filter-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderAnnouncements();
      });
    });

    if (user) {
      loadAnnouncements();
      loadAcademicPulse();
    }
  </script>
</body>
</html>
