<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Realtime School Chat | VidyaSphere</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/css/custom.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col md:flex-row pb-16 md:pb-0 overflow-x-hidden w-full">

  <!-- Desktop Sidebar -->
  <aside class="hidden md:flex flex-col w-64 bg-white border-r border-slate-200 p-4 shrink-0 h-screen sticky top-0 justify-between">
    <div class="space-y-6">
      <div class="flex items-center gap-3 px-2">
        <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-md shadow-indigo-200">
          <i data-lucide="graduation-cap" class="w-6 h-6"></i>
        </div>
        <div>
          <h2 class="font-extrabold text-slate-900 leading-tight">VidyaSphere</h2>
          <span class="text-xs text-slate-400 font-medium">School Edge Portal</span>
        </div>
      </div>

      <nav class="space-y-1">
        <a href="/dashboard/index.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-600 hover:bg-slate-100 font-semibold text-sm transition">
          <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Notice Board
        </a>
        <a href="/dashboard/chat.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl bg-indigo-50 text-indigo-700 font-bold text-sm">
          <i data-lucide="messages-square" class="w-5 h-5"></i> Realtime Chat
        </a>
        <a href="/dashboard/notes.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-600 hover:bg-slate-100 font-semibold text-sm transition">
          <i data-lucide="book-open" class="w-5 h-5"></i> Study Notes
        </a>
        <a href="/dashboard/qa.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-600 hover:bg-slate-100 font-semibold text-sm transition">
          <i data-lucide="message-square" class="w-5 h-5"></i> Academic Q&A
        </a>
        <a href="/dashboard/polls.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-600 hover:bg-slate-100 font-semibold text-sm transition">
          <i data-lucide="vote" class="w-5 h-5"></i> School Polls
        </a>
        <a href="/dashboard/students.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-600 hover:bg-slate-100 font-semibold text-sm transition">
          <i data-lucide="users" class="w-5 h-5"></i> Student Directory
        </a>
        <div id="admin-nav-link" class="hidden">
          <a href="/admin/index.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-rose-700 hover:bg-rose-50 font-bold text-sm transition">
            <i data-lucide="shield-alert" class="w-5 h-5"></i> Admin Portal
          </a>
        </div>
      </nav>
    </div>

    <!-- User Profile & Logout -->
    <div class="border-t border-slate-200 pt-4 px-2">
      <div class="flex items-center justify-between">
        <div class="overflow-hidden">
          <p id="user-display-name" class="font-bold text-sm text-slate-800 truncate"></p>
          <p id="user-display-role" class="text-xs text-slate-400 capitalize"></p>
        </div>
        <button id="logout-btn" title="Sign Out" class="p-2 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition">
          <i data-lucide="log-out" class="w-5 h-5"></i>
        </button>
      </div>
    </div>
  </aside>

  <!-- Mobile Top Header -->
  <header class="md:hidden sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200 px-3 py-2.5 flex items-center justify-between shadow-sm w-full">
    <div class="flex items-center gap-2 overflow-hidden">
      <div class="w-7 h-7 rounded-lg bg-indigo-600 flex items-center justify-center text-white shrink-0">
        <i data-lucide="graduation-cap" class="w-4 h-4"></i>
      </div>
      <span class="font-bold text-xs sm:text-sm text-slate-900 truncate">VidyaSphere</span>
    </div>
    <div class="flex items-center gap-2">
      <span id="user-display-name-mob" class="text-[11px] font-bold text-slate-700 truncate max-w-[110px]"></span>
      <button class="logout-btn-trigger p-1 text-slate-400 hover:text-rose-600 rounded-lg" title="Logout">
        <i data-lucide="log-out" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- Mobile Bottom Navigation -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur border-t border-slate-200 px-1 py-1 flex items-center justify-around shadow-lg max-w-full">
    <a href="/dashboard/index.html" class="flex-1 py-1.5 px-0.5 flex flex-col items-center justify-center text-slate-500 font-medium text-[9px] truncate">
      <i data-lucide="layout-dashboard" class="w-4 h-4 mb-0.5"></i>
      <span class="truncate">Notices</span>
    </a>
    <a href="/dashboard/chat.html" class="flex-1 py-1.5 px-0.5 flex flex-col items-center justify-center text-indigo-600 font-bold text-[9px] truncate">
      <i data-lucide="messages-square" class="w-4 h-4 mb-0.5"></i>
      <span class="truncate">Chat</span>
    </a>
    <a href="/dashboard/notes.html" class="flex-1 py-1.5 px-0.5 flex flex-col items-center justify-center text-slate-500 font-medium text-[9px] truncate">
      <i data-lucide="book-open" class="w-4 h-4 mb-0.5"></i>
      <span class="truncate">Notes</span>
    </a>
    <a href="/dashboard/qa.html" class="flex-1 py-1.5 px-0.5 flex flex-col items-center justify-center text-slate-500 font-medium text-[9px] truncate">
      <i data-lucide="message-square" class="w-4 h-4 mb-0.5"></i>
      <span class="truncate">Q&A</span>
    </a>
    <a href="/dashboard/polls.html" class="flex-1 py-1.5 px-0.5 flex flex-col items-center justify-center text-slate-500 font-medium text-[9px] truncate">
      <i data-lucide="vote" class="w-4 h-4 mb-0.5"></i>
      <span class="truncate">Polls</span>
    </a>
  </nav>

  <!-- Main Content Area: Chat Window -->
  <main class="flex-1 w-full max-w-5xl mx-auto p-2.5 sm:p-6 lg:p-8 flex flex-col h-[calc(100vh-4rem)] md:h-screen overflow-x-hidden">
    <!-- Chat Header -->
    <div class="bg-white rounded-t-2xl border border-slate-200 p-3 sm:p-4 shrink-0 flex items-center justify-between gap-2 shadow-sm w-full">
      <div class="flex items-center gap-2.5 overflow-hidden">
        <div class="w-8 h-8 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center font-bold shrink-0">
          <i data-lucide="hash" class="w-4 h-4"></i>
        </div>
        <div class="overflow-hidden">
          <h2 class="font-bold text-slate-900 text-xs sm:text-base truncate" id="channel-name">#school-hub</h2>
          <div class="flex items-center gap-1.5 text-[10px] sm:text-xs text-slate-400">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse shrink-0"></span>
            <span id="connection-status" class="truncate">Live Connected</span>
          </div>
        </div>
      </div>

      <select id="channel-select" class="px-2.5 py-1.5 rounded-xl border border-slate-300 text-xs font-semibold bg-white focus:ring-2 focus:ring-indigo-500 max-w-[130px] sm:max-w-xs shrink-0">
        <option value="school" selected>School Hub</option>
        <option value="academics">Academics</option>
        <option value="sports">Sports & Events</option>
      </select>
    </div>

    <!-- Chat Messages Stream -->
    <div id="messages-container" class="flex-1 bg-slate-100/70 border-x border-slate-200 p-3 sm:p-4 overflow-y-auto space-y-2.5 w-full">
      <div class="p-8 text-center text-slate-400 text-xs">
        Loading chat stream...
      </div>
    </div>

    <!-- Message Input Bar -->
    <div class="bg-white rounded-b-2xl border border-slate-200 p-2.5 sm:p-3 shrink-0 shadow-sm w-full">
      <form id="chat-form" class="flex gap-2 w-full">
        <input type="text" id="chat-input" required autocomplete="off"
          class="flex-1 px-3 py-2 rounded-xl border border-slate-300 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 min-w-0"
          placeholder="Type your message...">
        <button type="submit" id="send-btn"
          class="px-3.5 sm:px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs sm:text-sm transition flex items-center gap-1 shrink-0">
          <span>Send</span>
          <i data-lucide="send" class="w-3.5 h-3.5"></i>
        </button>
      </form>
    </div>
  </main>

  <script type="module">
    import { apiRequest } from '/js/api.js';
    import { requireAuth, logout, getToken } from '/js/auth.js';
    import { formatDateTime, initIcons } from '/js/ui.js';

    const user = requireAuth();
    if (user) {
      document.getElementById('user-display-name').textContent = user.fullName || user.username;
      document.getElementById('user-display-name-mob').textContent = user.fullName || user.username;
      document.getElementById('user-display-role').textContent = `${user.role} ${user.className ? '• ' + user.className : ''}`;
      if (user.role === 'admin') {
        document.getElementById('admin-nav-link').classList.remove('hidden');
      }
    }

    document.getElementById('logout-btn')?.addEventListener('click', logout);
    document.querySelectorAll('.logout-btn-trigger').forEach(btn => btn.addEventListener('click', logout));

    const messagesContainer = document.getElementById('messages-container');
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');
    const channelSelect = document.getElementById('channel-select');
    const channelName = document.getElementById('channel-name');
    const connectionStatus = document.getElementById('connection-status');

    let currentChannel = 'school';
    let ws = null;
    let reconnectTimeout = null;

    async function loadMessages() {
      try {
        const res = await apiRequest(`/chat/messages?channel=${currentChannel}`);
        const messages = res.messages || [];

        if (messages.length === 0) {
          messagesContainer.innerHTML = '<div class="p-8 text-center text-slate-400 text-xs">No messages yet. Say hello! 👋</div>';
          return;
        }

        messagesContainer.innerHTML = messages.map(msg => renderMessageHtml(msg)).join('');
        scrollToBottom();
      } catch (err) {
        messagesContainer.innerHTML = `<div class="p-4 text-center text-rose-500 text-xs">${err.message}</div>`;
      }
    }

    function renderMessageHtml(msg) {
      const isMe = user && msg.sender_id === user.id;
      const roleBadge = msg.sender_role === 'admin'
        ? '<span class="px-1.5 py-0.2 rounded text-[8px] font-bold uppercase bg-rose-100 text-rose-700">Admin</span>'
        : (msg.sender_role === 'teacher' ? '<span class="px-1.5 py-0.2 rounded text-[8px] font-bold uppercase bg-indigo-100 text-indigo-700">Teacher</span>' : '');

      return `
        <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'} max-w-full">
          <div class="flex items-center gap-1.5 mb-1 text-[10px] text-slate-400">
            <span class="font-bold text-slate-700 truncate max-w-[120px]">${isMe ? 'You' : (msg.sender_name || 'Member')}</span>
            ${roleBadge}
            <span>&bull;</span>
            <span>${formatDateTime(msg.created_at || msg.createdAt)}</span>
          </div>
          <div class="px-3.5 py-2 rounded-2xl max-w-[85%] sm:max-w-md text-xs sm:text-sm shadow-sm break-words leading-relaxed ${isMe ? 'bg-indigo-600 text-white rounded-tr-none' : 'bg-white text-slate-800 rounded-tl-none border border-slate-200'}">
            <p class="whitespace-pre-line">${msg.content}</p>
          </div>
        </div>
      `;
    }

    function scrollToBottom() {
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function connectWebSocket() {
      const token = getToken();
      if (!token) return;

      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}/api/chat/ws?token=${encodeURIComponent(token)}`;

      try {
        ws = new WebSocket(wsUrl);

        ws.onopen = () => {
          connectionStatus.textContent = 'Live Connected';
        };

        ws.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            if (data.type === 'new_message' && data.message.channel === currentChannel) {
              const msgHtml = renderMessageHtml({
                sender_id: data.message.senderId,
                sender_name: data.message.senderName,
                sender_role: data.message.senderRole,
                content: data.message.content,
                created_at: data.message.createdAt,
              });
              messagesContainer.insertAdjacentHTML('beforeend', msgHtml);
              scrollToBottom();
            }
          } catch (e) {}
        };

        ws.onclose = () => {
          connectionStatus.textContent = 'Reconnecting...';
          clearTimeout(reconnectTimeout);
          reconnectTimeout = setTimeout(connectWebSocket, 4000);
        };

        ws.onerror = () => {
          ws.close();
        };
      } catch (err) {
        connectionStatus.textContent = 'REST Mode';
      }
    }

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const content = chatInput.value.trim();
      if (!content) return;

      chatInput.value = '';

      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
          type: 'message',
          channel: currentChannel,
          content,
        }));
      } else {
        try {
          await apiRequest('/chat/messages', {
            method: 'POST',
            body: { content, channel: currentChannel },
          });
          loadMessages();
        } catch (err) {
          alert('Could not send message: ' + err.message);
        }
      }
    });

    channelSelect.addEventListener('change', () => {
      currentChannel = channelSelect.value;
      channelName.textContent = `#${channelSelect.options[channelSelect.selectedIndex].text.toLowerCase().replace(/[^a-z0-9]/g, '-')}`;
      loadMessages();
    });

    initIcons();
    loadMessages();
    connectWebSocket();
  </script>
</body>
</html>
