<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Study Notes Library | VidyaSphere</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0b57d0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/css/custom.css">
</head>
<body class="bg-[var(--md-surface)] text-[var(--md-on-surface)] min-h-screen flex flex-col md:flex-row pb-20 md:pb-0 w-full">

  <main class="flex-1 w-full max-w-5xl mx-auto p-3.5 sm:p-6 lg:p-8 space-y-5">
    <div class="m3-tonal-box p-5 sm:p-6 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 border border-[var(--md-outline)]">
      <div>
        <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight">Academic Notes &amp; Materials</h1>
        <p class="text-xs text-[var(--md-on-surface-variant)]">Download Teacher Verified notes, gzip-compressed PDFs &amp; permanent Drive links</p>
      </div>
      <button id="open-upload-btn" class="m3-btn-primary w-full sm:w-auto px-5 py-2.5 text-xs flex items-center justify-center gap-2">
        <i data-lucide="upload" class="w-4 h-4"></i> Upload Material
      </button>
    </div>

    <div class="m3-card p-3.5 space-y-2.5 w-full">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2.5">
        <div class="relative w-full">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
            <i data-lucide="search" class="w-4 h-4"></i>
          </span>
          <input type="text" id="note-search"
            class="m3-input w-full pl-9 pr-3 py-2 rounded-full border border-[var(--md-outline)] bg-[var(--md-surface)] text-xs sm:text-sm"
            placeholder="Search topic, chapter...">
        </div>
        <select id="note-class-filter" class="m3-input w-full px-3.5 py-2 rounded-full border border-[var(--md-outline)] text-xs sm:text-sm bg-white">
          <option value="">All Classes (1st - 12th)</option>
        </select>
        <select id="note-subject-filter" class="m3-input w-full px-3.5 py-2 rounded-full border border-[var(--md-outline)] text-xs sm:text-sm bg-white">
          <option value="">All Subjects</option>
        </select>
        <select id="note-sort" class="m3-input w-full px-3.5 py-2 rounded-full border border-[var(--md-outline)] text-xs sm:text-sm bg-white">
          <option value="newest">Newest First</option>
          <option value="downloads">Most Downloaded</option>
        </select>
      </div>
      <div class="flex items-center justify-between pt-2 border-t border-[var(--md-outline)]">
        <button type="button" id="verified-only-chip" class="m3-chip px-3.5 py-1 text-[11px] font-semibold inline-flex items-center gap-1.5">
          <i data-lucide="badge-check" class="w-3.5 h-3.5"></i> Teacher Verified Only
        </button>
        <span id="notes-count-label" class="text-[11px] font-semibold text-[var(--md-on-surface-variant)] tabular-nums"></span>
      </div>
    </div>

    <div id="notes-grid" class="grid grid-cols-1 md:grid-cols-2 gap-3.5 w-full">
      <div class="col-span-full m3-card p-8 text-center text-slate-400 text-xs">Loading notes repository...</div>
    </div>
  </main>

  <!-- Upload Modal (Material 3 Bottom Sheet on Mobile) -->
  <div id="upload-modal" class="m3-modal-backdrop fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs hidden items-center justify-center p-4">
    <div class="m3-modal-panel bg-white rounded-[28px] w-full max-w-md p-5 space-y-3.5 shadow-2xl overflow-y-auto max-h-[90vh] modal-enter">
      <div class="m3-sheet-handle sm:hidden"></div>
      <div class="flex items-center justify-between pb-2 border-b border-slate-100">
        <h3 class="text-base font-extrabold">Upload Study Material</h3>
        <button id="close-upload-modal" class="p-1.5 rounded-full hover:bg-slate-100 text-slate-500"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>

      <form id="upload-form" class="space-y-3">
        <div>
          <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1">Title / Topic</label>
          <input type="text" id="up-title" required class="m3-input w-full px-3.5 py-2 rounded-2xl border border-[var(--md-outline)] text-xs sm:text-sm" placeholder="e.g. Chapter 4: Carbon Compounds">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1">Class</label>
            <select id="up-class" required class="m3-input w-full px-2.5 py-2 rounded-2xl border border-[var(--md-outline)] text-xs bg-white"></select>
          </div>
          <div>
            <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1">Subject</label>
            <select id="up-subject" required class="m3-input w-full px-2.5 py-2 rounded-2xl border border-[var(--md-outline)] text-xs bg-white"></select>
          </div>
        </div>

        <div>
          <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1">Chapter</label>
          <input type="text" id="up-chapter" class="m3-input w-full px-3.5 py-2 rounded-2xl border border-[var(--md-outline)] text-xs sm:text-sm" placeholder="e.g. Chapter 4">
        </div>

        <div>
          <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1">Description</label>
          <textarea id="up-desc" rows="2" class="m3-input w-full px-3.5 py-2 rounded-2xl border border-[var(--md-outline)] text-xs sm:text-sm" placeholder="Important formulas, solved examples..."></textarea>
        </div>

        <div>
          <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1.5">Storage Mode</label>
          <div class="grid grid-cols-2 gap-2">
            <label id="mode-card-drive" class="cursor-pointer border-2 border-[var(--md-primary)] bg-[var(--md-surface-container)] p-2.5 rounded-2xl flex items-center gap-2 transition">
              <input type="radio" name="note-type-radio" value="drive_link" checked>
              <span class="text-xs font-bold leading-tight">Google Drive<br><span class="text-[10px] font-normal text-emerald-700">Permanent • Full Session</span></span>
            </label>
            <label id="mode-card-file" class="cursor-pointer border border-[var(--md-outline)] bg-white p-2.5 rounded-2xl flex items-center gap-2 transition">
              <input type="radio" name="note-type-radio" value="file">
              <span class="text-xs font-bold leading-tight">Direct PDF/Img<br><span id="quota-hint" class="text-[10px] font-normal text-amber-700">Max 15MB • 30 Days</span></span>
            </label>
          </div>
        </div>

        <div id="drive-link-box">
          <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1">Public Google Drive / Cloud Link</label>
          <input type="url" id="up-drive-url" class="m3-input w-full px-3.5 py-2 rounded-2xl border border-[var(--md-outline)] text-xs font-mono" placeholder="https://drive.google.com/file/d/.../view">
        </div>

        <div id="direct-file-box" class="hidden">
          <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1">Select PDF or Image (Max 15MB)</label>
          <input type="file" id="up-file" accept="application/pdf,image/*" class="w-full text-xs text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-full file:border-0 file:text-xs file:font-bold file:bg-[var(--md-primary-container)] file:text-[var(--md-on-primary-container)]">
          <p id="direct-quota-msg" class="text-[10px] text-amber-700 font-medium mt-1">Direct uploads expire after 30 days (max 4/day for students, 20/day for teachers).</p>
        </div>

        <button type="submit" id="up-submit-btn" class="m3-btn-primary w-full py-3 text-xs sm:text-sm">Publish to Library</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { apiRequest } from '/js/api.js';
    import { initDashboardShell } from '/js/layout.js';
    import { CLASS_LIST, SUBJECT_LIST, escapeHtml, safeUrl, formatDate, formatFileSize, renderRoleBadgeHtml, showToast, initIcons, bindModalBackdropAndEsc } from '/js/ui.js';

    const user = initDashboardShell({ active: 'notes', mobileTitle: 'Study Notes' });
    if (user?.role === 'teacher' || user?.role === 'admin') {
      document.getElementById('direct-quota-msg').textContent = user.role === 'admin'
        ? 'Admin Verified: Unlimited direct uploads (30-day storage).'
        : 'Teacher Verified: Up to 20 direct uploads per 24 hours (30-day storage).';
    }

    const searchInput = document.getElementById('note-search');
    const classFilter = document.getElementById('note-class-filter');
    const subjectFilter = document.getElementById('note-subject-filter');
    const sortFilter = document.getElementById('note-sort');
    const verifiedChip = document.getElementById('verified-only-chip');
    const countLabel = document.getElementById('notes-count-label');
    const grid = document.getElementById('notes-grid');
    const uploadModal = document.getElementById('upload-modal');
    const uploadForm = document.getElementById('upload-form');
    let verifiedOnly = false;

    CLASS_LIST.forEach(c => {
      classFilter.innerHTML += `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`;
      document.getElementById('up-class').innerHTML += `<option value="${escapeHtml(c)}" ${c === (user?.className || 'Class 10') ? 'selected' : ''}>${escapeHtml(c)}</option>`;
    });
    SUBJECT_LIST.forEach(s => {
      subjectFilter.innerHTML += `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`;
      document.getElementById('up-subject').innerHTML += `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`;
    });

    const closeModal = () => { uploadModal.classList.add('hidden'); uploadModal.classList.remove('flex'); };
    document.getElementById('open-upload-btn').addEventListener('click', () => { uploadModal.classList.remove('hidden'); uploadModal.classList.add('flex'); });
    document.getElementById('close-upload-modal').addEventListener('click', closeModal);
    bindModalBackdropAndEsc(uploadModal, closeModal);

    verifiedChip.addEventListener('click', () => {
      verifiedOnly = !verifiedOnly;
      verifiedChip.classList.toggle('active', verifiedOnly);
      loadNotes();
    });

    async function loadNotes() {
      const params = new URLSearchParams();
      if (searchInput.value.trim()) params.append('search', searchInput.value.trim());
      if (classFilter.value) params.append('className', classFilter.value);
      if (subjectFilter.value) params.append('subject', subjectFilter.value);
      if (sortFilter.value) params.append('sort', sortFilter.value);
      if (verifiedOnly) params.append('verified', '1');

      try {
        const res = await apiRequest(`/notes?${params.toString()}`);
        const notes = res.notes || [];
        if (countLabel) countLabel.textContent = `${notes.length} note${notes.length === 1 ? '' : 's'}`;

        if (notes.length === 0) {
          grid.innerHTML = `<div class="col-span-full m3-card p-10 text-center text-slate-400 text-xs">No study notes match this filter.</div>`;
          return;
        }

        grid.innerHTML = notes.map(note => {
          const isDrive = note.note_type === 'drive_link';
          const driveHref = safeUrl(note.drive_url);
          const canDelete = user && (user.id === note.uploader_id || user.role === 'admin');
          const isTeacherVerified = note.is_teacher_verified === 1 || note.uploader_role === 'teacher' || note.uploader_role === 'admin';

          return `
            <article class="m3-card m3-card-interactive p-5 space-y-3 flex flex-col justify-between w-full break-words">
              <div class="space-y-2">
                <div class="flex items-center justify-between gap-2 flex-wrap">
                  <div class="flex items-center gap-1.5 flex-wrap">
                    <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase bg-[var(--md-primary-container)] text-[var(--md-on-primary-container)]">${escapeHtml(note.subject)}</span>
                    ${isTeacherVerified ? `<span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800 inline-flex items-center gap-1"><i data-lucide="badge-check" class="w-3 h-3"></i> ${note.uploader_role === 'admin' ? 'Admin Verified' : 'Teacher Verified'}</span>` : ''}
                  </div>
                  ${isDrive
                    ? `<span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-200">Drive • ${escapeHtml(note.academic_year || '2026-2027')}</span>`
                    : `<span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-amber-100 text-amber-800 tabular-nums">${note.file_size ? formatFileSize(note.file_size) + ' • ' : ''}${note.expires_at ? 'Exp ' + escapeHtml(formatDate(note.expires_at)) : '30-Day'}</span>`
                  }
                </div>
                <h3 class="font-extrabold text-sm sm:text-base leading-snug">${escapeHtml(note.title)}</h3>
                ${note.chapter ? `<p class="text-[11px] font-bold text-[var(--md-primary)]">${escapeHtml(note.chapter)}</p>` : ''}
                <p class="text-xs text-[var(--md-on-surface-variant)] line-clamp-2">${escapeHtml(note.description || 'No description provided')}</p>
              </div>

              <div class="pt-3 border-t border-[var(--md-outline)] flex items-center justify-between text-xs gap-2 flex-wrap">
                <div class="flex items-center gap-1.5 text-slate-500 text-[11px] truncate tabular-nums">
                  <span class="font-bold text-slate-700">${escapeHtml(note.class_name)}</span>
                  <span>•</span>
                  <span class="flex items-center gap-0.5"><i data-lucide="eye" class="w-3 h-3"></i> ${note.download_count}</span>
                  ${note.uploader_name ? `<span>•</span><span class="truncate max-w-[110px]">By ${escapeHtml(note.uploader_name)}</span>` : ''}
                  ${renderRoleBadgeHtml(note.uploader_role, note.uploader_teacher_type, note.uploader_is_root_admin === 1)}
                </div>

                <div class="flex items-center gap-1 shrink-0">
                  <button data-note-id="${escapeHtml(note.id)}" class="report-note-btn p-1.5 text-slate-400 hover:text-amber-700 hover:bg-amber-50 rounded-full transition" title="Report inaccurate note">
                    <i data-lucide="flag" class="w-3.5 h-3.5"></i>
                  </button>
                  ${canDelete ? `
                    <button data-note-id="${escapeHtml(note.id)}" data-note-title="${escapeHtml(note.title)}" class="delete-note-btn p-1.5 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-full transition" title="Delete Note">
                      <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                    </button>
                  ` : ''}
                  ${isDrive && driveHref ? `
                    <a href="${escapeHtml(driveHref)}" target="_blank" rel="noopener noreferrer"
                      class="px-3.5 py-1.5 rounded-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs flex items-center gap-1 transition">
                      <i data-lucide="external-link" class="w-3 h-3"></i> Open Drive
                    </a>
                  ` : `
                    <a href="/api/notes/${encodeURIComponent(note.id)}/file" target="_blank"
                      class="m3-btn-primary px-3.5 py-1.5 text-xs flex items-center gap-1">
                      <i data-lucide="arrow-down-to-line" class="w-3 h-3"></i> Download
                    </a>
                  `}
                </div>
              </div>
            </article>
          `;
        }).join('');

        initIcons();

        grid.querySelectorAll('.report-note-btn').forEach(btn => {
          btn.addEventListener('click', async () => {
            const reason = prompt('Why are you reporting this note (e.g. wrong answers, outdated syllabus)?');
            if (!reason || !reason.trim()) return;
            try {
              await apiRequest(`/notes/${encodeURIComponent(btn.dataset.noteId)}/report`, {
                method: 'POST',
                body: { reason: reason.trim() }
              });
              showToast('Note reported to moderators.', 'info');
            } catch (err) {
              showToast(err.message, 'error');
            }
          });
        });

        grid.querySelectorAll('.delete-note-btn').forEach(btn => {
          btn.addEventListener('click', async () => {
            if (!confirm(`Delete "${btn.dataset.noteTitle || 'this note'}" permanently?`)) return;
            try {
              btn.disabled = true;
              await apiRequest(`/notes/${encodeURIComponent(btn.dataset.noteId)}`, { method: 'DELETE' });
              showToast('Study note deleted successfully', 'success');
              loadNotes();
            } catch (err) {
              showToast(err.message || 'Failed to delete note', 'error');
              btn.disabled = false;
            }
          });
        });
      } catch (err) {
        grid.innerHTML = `<div class="col-span-full p-6 text-center text-rose-600 bg-rose-50 rounded-3xl text-xs">${escapeHtml(err.message)}</div>`;
      }
    }

    const driveBox = document.getElementById('drive-link-box');
    const fileBox = document.getElementById('direct-file-box');
    const cardDrive = document.getElementById('mode-card-drive');
    const cardFile = document.getElementById('mode-card-file');
    document.querySelectorAll('input[name="note-type-radio"]').forEach(radio => {
      radio.addEventListener('change', (e) => {
        const isDrive = e.target.value === 'drive_link';
        driveBox.classList.toggle('hidden', !isDrive);
        fileBox.classList.toggle('hidden', isDrive);
        cardDrive.className = `cursor-pointer ${isDrive ? 'border-2 border-[var(--md-primary)] bg-[var(--md-surface-container)]' : 'border border-[var(--md-outline)] bg-white'} p-2.5 rounded-2xl flex items-center gap-2 transition`;
        cardFile.className = `cursor-pointer ${!isDrive ? 'border-2 border-[var(--md-primary)] bg-[var(--md-surface-container)]' : 'border border-[var(--md-outline)] bg-white'} p-2.5 rounded-2xl flex items-center gap-2 transition`;
      });
    });

    uploadForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('up-submit-btn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Publishing...';

      const selectedType = document.querySelector('input[name="note-type-radio"]:checked')?.value || 'drive_link';
      const file = document.getElementById('up-file').files[0];
      const driveUrl = document.getElementById('up-drive-url').value.trim();

      try {
        let res;
        if (selectedType === 'file') {
          if (!file) { showToast('Please select a file', 'warning'); return; }
          if (file.size > 15 * 1024 * 1024) { showToast('File exceeds 15MB limit', 'warning'); return; }
          const formData = new FormData();
          formData.append('title', document.getElementById('up-title').value.trim());
          formData.append('className', document.getElementById('up-class').value);
          formData.append('subject', document.getElementById('up-subject').value);
          formData.append('chapter', document.getElementById('up-chapter').value.trim());
          formData.append('description', document.getElementById('up-desc').value.trim());
          formData.append('noteType', 'file');
          formData.append('file', file);
          res = await apiRequest('/notes/upload', { method: 'POST', body: formData });
        } else {
          if (!safeUrl(driveUrl)) { showToast('Enter a valid http:// or https:// Drive link', 'warning'); return; }
          res = await apiRequest('/notes/upload', {
            method: 'POST',
            body: {
              title: document.getElementById('up-title').value.trim(),
              className: document.getElementById('up-class').value,
              subject: document.getElementById('up-subject').value,
              chapter: document.getElementById('up-chapter').value.trim(),
              description: document.getElementById('up-desc').value.trim(),
              noteType: 'drive_link',
              driveUrl,
            },
          });
        }

        showToast(res.message || 'Study material published!', 'success');
        closeModal();
        uploadForm.reset();
        driveBox.classList.remove('hidden');
        fileBox.classList.add('hidden');
        loadNotes();
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Publish to Library';
      }
    });

    searchInput.addEventListener('input', () => { clearTimeout(window._searchTimer); window._searchTimer = setTimeout(loadNotes, 300); });
    classFilter.addEventListener('change', loadNotes);
    subjectFilter.addEventListener('change', loadNotes);
    sortFilter.addEventListener('change', loadNotes);

    if (user) loadNotes();
  </script>
</body>
</html>
