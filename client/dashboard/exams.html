<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Exam Timetable &amp; Schedule | VidyaSphere</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f172a">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/css/custom.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col md:flex-row pb-16 md:pb-0 w-full">

  <main class="flex-1 w-full max-w-5xl mx-auto p-3.5 sm:p-6 lg:p-8 space-y-5">
    <div class="bg-slate-950 rounded-2xl p-5 sm:p-6 text-white flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 border border-slate-800">
      <div class="space-y-1">
        <span class="px-2.5 py-0.5 rounded-full bg-purple-500/20 text-purple-300 border border-purple-400/30 text-[10px] font-bold uppercase tracking-wider inline-block">
          Official Examination Portal
        </span>
        <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight">School Examination Schedules</h1>
        <p class="text-slate-400 text-xs sm:text-sm">Confirmed datesheets, timings, room numbers, and syllabus instructions.</p>
      </div>
      <div id="admin-quick-action" class="hidden shrink-0">
        <a href="/admin/index.html" class="px-3.5 py-2 bg-white text-slate-900 font-bold text-xs rounded-xl hover:bg-slate-100 transition inline-flex items-center gap-1.5">
          <i data-lucide="plus-circle" class="w-4 h-4 text-purple-600"></i> Manage Exams
        </a>
      </div>
    </div>

    <!-- Filters Bar -->
    <div class="bg-white p-3.5 sm:p-4 rounded-2xl border border-slate-200/80 shadow-[0_1px_2px_rgba(15,23,42,0.03)] space-y-3">
      <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-2.5">
        <div class="relative flex-1">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
          <input type="text" id="exam-search" placeholder="Search by subject, title, or exam room..."
            class="w-full pl-9 pr-4 py-2 rounded-xl border border-slate-200 bg-slate-50/50 focus:bg-white text-xs sm:text-sm focus:ring-2 focus:ring-purple-500/30 focus:outline-none">
        </div>
        <div class="flex items-center gap-2">
          <span class="text-xs text-slate-500 font-semibold shrink-0">Class:</span>
          <select id="class-filter-select" class="px-3 py-2 rounded-xl border border-slate-200 text-xs font-semibold bg-slate-50 focus:ring-2 focus:ring-purple-500/30">
            <option value="all">All Classes</option>
            <option value="my_class" id="my-class-option">My Class</option>
            <option value="Class 10">Class 10 (SSC/CBSE)</option>
            <option value="Class 12">Class 12 (HSC/CBSE)</option>
            <option value="Class 11">Class 11</option>
            <option value="Class 9">Class 9</option>
            <option value="Class 8">Class 8</option>
            <option value="Class 7">Class 7</option>
            <option value="Class 6">Class 6</option>
            <option value="Class 5">Class 5</option>
            <option value="Class 4">Class 4</option>
            <option value="Class 3">Class 3</option>
            <option value="Class 2">Class 2</option>
            <option value="Class 1">Class 1</option>
          </select>
        </div>
      </div>

      <div class="flex items-center justify-between pt-2 border-t border-slate-100 text-[11px] text-slate-500">
        <span id="exams-count-info" class="tabular-nums font-medium">Loading timetable...</span>
        <span class="text-slate-400">Read-only verified schedule</span>
      </div>
    </div>

    <div id="exams-container" class="space-y-3 w-full">
      <div class="p-8 text-center text-slate-400 bg-white rounded-2xl border border-slate-200/80 text-xs">Loading scheduled exams...</div>
    </div>
  </main>

  <script type="module">
    import { apiRequest } from '/js/api.js';
    import { initDashboardShell } from '/js/layout.js';
    import { escapeHtml, safeUrl, initIcons } from '/js/ui.js';

    const user = initDashboardShell({ active: 'exams', mobileTitle: 'Exams Timetable' });
    if (user) {
      if (user.className) {
        document.getElementById('my-class-option').textContent = `My Class (${user.className})`;
      } else {
        document.getElementById('my-class-option').remove();
      }
      if (user.role === 'admin') {
        document.getElementById('admin-quick-action').classList.remove('hidden');
      }
    }

    let allExams = [];
    const searchInput = document.getElementById('exam-search');
    const classFilter = document.getElementById('class-filter-select');
    const container = document.getElementById('exams-container');
    const countInfo = document.getElementById('exams-count-info');

    async function loadExams() {
      try {
        const res = await apiRequest('/exams');
        allExams = res.exams || [];
        renderExams();
      } catch (err) {
        container.innerHTML = `<div class="p-6 text-center text-rose-600 bg-rose-50 rounded-2xl border border-rose-200 text-xs">${escapeHtml(err.message)}</div>`;
      }
    }

    function calculateCountdown(dateStr) {
      const parts = String(dateStr || '').split('-').map(Number);
      if (parts.length !== 3 || parts.some(isNaN)) {
        return { label: 'Scheduled', color: 'bg-slate-100 text-slate-600 border-slate-200', prettyDate: dateStr || '-' };
      }

      const [y, m, d] = parts;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const examDate = new Date(y, m - 1, d);
      examDate.setHours(0, 0, 0, 0);

      const diffDays = Math.round((examDate - today) / (1000 * 60 * 60 * 24));
      const dayName = examDate.toLocaleDateString('en-US', { weekday: 'short' });
      const monthName = examDate.toLocaleDateString('en-US', { month: 'short' });
      const prettyDate = `${dayName}, ${String(d).padStart(2, '0')} ${monthName} ${y}`;

      if (diffDays < 0) return { label: 'Completed', color: 'bg-slate-100 text-slate-500 border-slate-200', prettyDate };
      if (diffDays === 0) return { label: 'TODAY', color: 'bg-rose-50 text-rose-700 border-rose-300 font-extrabold animate-pulse', prettyDate };
      if (diffDays === 1) return { label: 'TOMORROW', color: 'bg-amber-50 text-amber-800 border-amber-300 font-bold', prettyDate };
      return { label: `In ${diffDays} Days`, color: 'bg-purple-50 text-purple-700 border-purple-200 font-bold', prettyDate };
    }

    function renderExams() {
      const searchTerm = (searchInput.value || '').toLowerCase().trim();
      const selectedClass = classFilter.value;

      const filtered = allExams.filter(ex => {
        if (selectedClass === 'my_class' && user?.className) {
          const match = ex.class_name === 'all' || ex.class_name === 'All Classes' || ex.class_name === user.className;
          if (!match) return false;
        } else if (selectedClass !== 'all') {
          const match = ex.class_name === 'all' || ex.class_name === 'All Classes' || ex.class_name === selectedClass;
          if (!match) return false;
        }

        if (searchTerm) {
          const hit = [ex.title, ex.subject, ex.room_or_hall, ex.syllabus]
            .some(v => (v || '').toLowerCase().includes(searchTerm));
          if (!hit) return false;
        }
        return true;
      });

      countInfo.textContent = `${filtered.length} exam${filtered.length === 1 ? '' : 's'} scheduled`;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="p-10 text-center text-slate-400 bg-white rounded-2xl border border-slate-200/80">
            <i data-lucide="calendar-check" class="w-8 h-8 mx-auto mb-2 opacity-40 text-purple-600"></i>
            <p class="text-sm font-semibold text-slate-700">No scheduled exams found</p>
            <p class="text-xs text-slate-400 mt-1">Try selecting All Classes or check back later.</p>
          </div>
        `;
        initIcons();
        return;
      }

      container.innerHTML = filtered.map(ex => {
        const countdown = calculateCountdown(ex.exam_date);
        const safeDrive = safeUrl(ex.drive_link);

        return `
          <article class="bg-white rounded-2xl border border-slate-200/80 p-4 sm:p-5 card-hover space-y-3 w-full break-words">
            <div class="flex items-center justify-between flex-wrap gap-2">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="px-2.5 py-0.5 rounded-full text-[10px] uppercase border tabular-nums ${countdown.color}">${escapeHtml(countdown.label)}</span>
                <span class="text-[10px] font-semibold text-purple-700 bg-purple-50 px-2.5 py-0.5 rounded-full border border-purple-200">${escapeHtml(ex.class_name)}</span>
                <span class="text-[10px] font-semibold text-indigo-700 bg-indigo-50 px-2 py-0.5 rounded-md border border-indigo-100">${escapeHtml(ex.subject)}</span>
              </div>
              <span class="text-[11px] text-slate-400 font-medium tabular-nums">Session: ${escapeHtml(ex.academic_year)}</span>
            </div>

            <h3 class="text-base sm:text-lg font-bold text-slate-900 leading-snug">${escapeHtml(ex.title)}</h3>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 py-2.5 px-3 bg-slate-50 rounded-xl border border-slate-200/60 text-xs tabular-nums">
              <div class="flex items-center gap-2 text-slate-800 font-semibold">
                <i data-lucide="calendar" class="w-4 h-4 text-purple-600 shrink-0"></i>
                <span>${escapeHtml(countdown.prettyDate)}</span>
              </div>
              <div class="flex items-center gap-2 text-slate-600">
                <i data-lucide="clock" class="w-4 h-4 text-indigo-600 shrink-0"></i>
                <span>${ex.start_time ? `${escapeHtml(ex.start_time)}${ex.end_time ? ' - ' + escapeHtml(ex.end_time) : ''}` : 'As per schedule'}</span>
              </div>
              <div class="flex items-center gap-2 text-slate-600">
                <i data-lucide="map-pin" class="w-4 h-4 text-rose-600 shrink-0"></i>
                <span class="truncate">${escapeHtml(ex.room_or_hall || 'Main Examination Block')}</span>
              </div>
            </div>

            ${ex.syllabus ? `
              <div class="p-3 bg-amber-50/70 rounded-xl border border-amber-200/70 text-xs text-amber-950 space-y-1">
                <div class="flex items-center gap-1.5 font-bold text-amber-900">
                  <i data-lucide="book-marked" class="w-3.5 h-3.5 text-amber-700"></i>
                  <span>Syllabus &amp; Instructions</span>
                </div>
                <p class="text-[11px] text-amber-900 leading-relaxed whitespace-pre-line">${escapeHtml(ex.syllabus)}</p>
              </div>
            ` : ''}

            <div class="pt-2 border-t border-slate-100 flex items-center justify-between flex-wrap gap-2 text-xs">
              <span class="text-[11px] text-slate-400">Verified by <strong class="text-slate-600">${escapeHtml(ex.author_name || 'Lead Admin')}</strong></span>
              ${safeDrive ? `
                <a href="${escapeHtml(safeDrive)}" target="_blank" rel="noopener noreferrer"
                  class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold text-xs border border-emerald-200 transition">
                  <i data-lucide="cloud-download" class="w-3.5 h-3.5"></i> Timetable PDF
                </a>
              ` : `<span class="text-[10px] text-slate-400 font-mono">ID: ${escapeHtml(ex.id)}</span>`}
            </div>
          </article>
        `;
      }).join('');

      initIcons();
    }

    searchInput.addEventListener('input', renderExams);
    classFilter.addEventListener('change', renderExams);

    if (user) loadExams();
  </script>
</body>
</html>
