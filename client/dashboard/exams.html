<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam Timetable &amp; Schedule | VidyaSphere</title>
  <meta name="description" content="Track board exam dates, class unit tests, timings, exam rooms, syllabus breakdowns, and date-sheet links on VidyaSphere.">
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:site_name" content="VidyaSphere">
  <meta property="og:title" content="Exam Timetable &amp; Schedule | VidyaSphere">
  <meta property="og:description" content="Live school exam schedules, unit tests, and syllabus trackers.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%230b57d0'/><text x='50' y='66' font-size='52' text-anchor='middle' fill='white'>🎓</text></svg>">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0b57d0">
  <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/css/custom.css">
</head>
<body class="bg-[var(--md-surface)] text-[var(--md-on-surface)] min-h-screen flex flex-col md:flex-row pb-20 md:pb-0 w-full">

  <main class="flex-1 w-full max-w-5xl mx-auto p-3.5 sm:p-6 lg:p-8 space-y-5">
    <div class="m3-tonal-box p-5 sm:p-6 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 border border-[var(--md-outline)]">
      <div class="space-y-1">
        <span class="px-3 py-1 rounded-full bg-[var(--md-primary-container)] text-[var(--md-on-primary-container)] text-[10px] font-bold uppercase tracking-wider inline-block">
          Official Examination Portal
        </span>
        <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight">School Examination &amp; Test Schedules</h1>
        <p class="text-[var(--md-on-surface-variant)] text-xs sm:text-sm">Board datesheets, class unit tests, timings, room numbers, and syllabus.</p>
      </div>
      <div id="exam-manage-action" class="hidden shrink-0">
        <a id="exam-manage-link" href="/admin/index.html" class="m3-btn-primary px-4 py-2.5 text-xs inline-flex items-center gap-1.5">
          <i data-lucide="plus-circle" class="w-4 h-4"></i> <span id="exam-manage-label">Manage Exams</span>
        </a>
      </div>
    </div>

    <!-- Filters Bar -->
    <div class="m3-card p-3.5 sm:p-4 space-y-3">
      <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-2.5">
        <div class="relative flex-1">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
          <input type="text" id="exam-search" placeholder="Search by subject, title, or exam room..."
            class="m3-input w-full pl-9 pr-4 py-2 rounded-full border border-[var(--md-outline)] bg-[var(--md-surface)] focus:bg-white text-xs sm:text-sm">
        </div>
        <div class="flex items-center gap-2">
          <span class="text-xs text-slate-500 font-semibold shrink-0">Class:</span>
          <select id="class-filter-select" class="m3-input px-3.5 py-2 rounded-full border border-[var(--md-outline)] text-xs font-semibold bg-white">
            <option value="all">All Classes</option>
          </select>
        </div>
      </div>

      <div class="flex items-center justify-between flex-wrap gap-2 pt-2 border-t border-[var(--md-outline)]">
        <div class="flex items-center gap-1.5">
          <button data-type="all" class="exam-type-chip m3-chip active px-3.5 py-1 text-[11px]">All</button>
          <button data-type="board" class="exam-type-chip m3-chip px-3.5 py-1 text-[11px] font-semibold">Official Exams</button>
          <button data-type="unit_test" class="exam-type-chip m3-chip px-3.5 py-1 text-[11px] font-semibold">Class Tests</button>
        </div>
        <span id="exams-count-info" class="text-[11px] text-[var(--md-on-surface-variant)] tabular-nums font-semibold">Loading timetable...</span>
      </div>
    </div>

    <div id="exams-container" class="space-y-3 w-full">
      <div class="m3-card p-8 text-center text-slate-400 text-xs">Loading scheduled exams...</div>
    </div>
  </main>

  <script type="module">
    import { apiRequest } from '/js/api.js';
    import { initDashboardShell } from '/js/layout.js';
    import { CLASS_LIST, escapeHtml, safeUrl, renderRoleBadgeHtml, initIcons } from '/js/ui.js';

    const user = initDashboardShell({ active: 'exams', mobileTitle: 'Exams Timetable' });
    const classFilter = document.getElementById('class-filter-select');

    if (user) {
      if (user.className) {
        const myOpt = document.createElement('option');
        myOpt.value = 'my_class';
        myOpt.textContent = `My Class (${user.className})`;
        classFilter.appendChild(myOpt);
      }
      CLASS_LIST.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        classFilter.appendChild(opt);
      });

      if (user.role === 'admin') {
        document.getElementById('exam-manage-action').classList.remove('hidden');
      } else if (user.role === 'teacher' && user.teacherType === 'class') {
        document.getElementById('exam-manage-action').classList.remove('hidden');
        document.getElementById('exam-manage-link').href = '/teacher/index.html';
        document.getElementById('exam-manage-label').textContent = 'Manage Unit Tests';
      }
    }

    let allExams = [];
    let selectedType = 'all';
    const searchInput = document.getElementById('exam-search');
    const container = document.getElementById('exams-container');
    const countInfo = document.getElementById('exams-count-info');

    async function loadExams() {
      try {
        const res = await apiRequest('/exams');
        allExams = res.exams || [];
        renderExams();
      } catch (err) {
        container.innerHTML = `<div class="m3-card p-6 text-center text-rose-600 text-xs">${escapeHtml(err.message)}</div>`;
      }
    }

    function calculateCountdown(dateStr) {
      const parts = String(dateStr || '').split('-').map(Number);
      if (parts.length !== 3 || parts.some(isNaN)) {
        return { label: 'Scheduled', color: 'bg-slate-100 text-slate-600', prettyDate: dateStr || '-' };
      }

      const [y, m, d] = parts;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const examDate = new Date(y, m - 1, d);
      examDate.setHours(0, 0, 0, 0);

      const diffDays = Math.round((examDate - today) / (1000 * 60 * 60 * 24));
      const dayName = examDate.toLocaleDateString('en-US', { weekday: 'short' });
      const monthName = examDate.toLocaleDateString('en-US', { month: 'short' });
      const prettyDate = `${dayName}, ${String(d).padStart(2, '0')} ${monthName} ${y}`;

      if (diffDays < 0) return { label: 'Completed', color: 'bg-slate-100 text-slate-500', prettyDate };
      if (diffDays === 0) return { label: 'TODAY', color: 'bg-rose-100 text-rose-800 font-extrabold animate-pulse', prettyDate };
      if (diffDays === 1) return { label: 'TOMORROW', color: 'bg-amber-100 text-amber-900 font-bold', prettyDate };
      return { label: `In ${diffDays} Days`, color: 'bg-purple-100 text-purple-800 font-bold', prettyDate };
    }

    function renderExams() {
      const searchTerm = (searchInput.value || '').toLowerCase().trim();
      const selectedClass = classFilter.value;

      const filtered = allExams.filter(ex => {
        if (selectedType !== 'all' && (ex.exam_type || 'board') !== selectedType) return false;

        if (selectedClass === 'my_class' && user?.className) {
          const match = ex.class_name === 'all' || ex.class_name === 'All Classes' || ex.class_name === user.className;
          if (!match) return false;
        } else if (selectedClass !== 'all') {
          const match = ex.class_name === 'all' || ex.class_name === 'All Classes' || ex.class_name === selectedClass;
          if (!match) return false;
        }

        if (searchTerm) {
          const hit = [ex.title, ex.subject, ex.room_or_hall, ex.syllabus]
            .some(v => (v || '').toLowerCase().includes(searchTerm));
          if (!hit) return false;
        }
        return true;
      });

      countInfo.textContent = `${filtered.length} exam${filtered.length === 1 ? '' : 's'} scheduled`;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="m3-card p-10 text-center text-slate-400">
            <i data-lucide="calendar-check" class="w-8 h-8 mx-auto mb-2 opacity-40 text-[var(--md-primary)]"></i>
            <p class="text-sm font-bold text-slate-700">No scheduled exams found</p>
            <p class="text-xs text-slate-400 mt-1">Try selecting All Classes or check back later.</p>
          </div>
        `;
        initIcons();
        return;
      }

      container.innerHTML = filtered.map(ex => {
        const countdown = calculateCountdown(ex.exam_date);
        const safeDrive = safeUrl(ex.drive_link);

        return `
          <article class="m3-card m3-card-interactive p-5 space-y-3 w-full break-words">
            <div class="flex items-center justify-between flex-wrap gap-2">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase ${ex.exam_type === 'unit_test' ? 'bg-sky-100 text-sky-800' : 'bg-[var(--md-primary)] text-[var(--md-on-primary)]'}">${ex.exam_type === 'unit_test' ? 'Class Test' : 'Official Exam'}</span>
                <span class="px-2.5 py-0.5 rounded-full text-[10px] uppercase tabular-nums ${countdown.color}">${escapeHtml(countdown.label)}</span>
                <span class="text-[10px] font-bold bg-[var(--md-surface-container)] px-2.5 py-0.5 rounded-full">${escapeHtml(ex.class_name)}</span>
                <span class="text-[10px] font-bold bg-[var(--md-primary-container)] text-[var(--md-on-primary-container)] px-2.5 py-0.5 rounded-full">${escapeHtml(ex.subject)}</span>
              </div>
              <span class="text-[11px] text-slate-400 font-medium tabular-nums">Session: ${escapeHtml(ex.academic_year)}</span>
            </div>

            <h3 class="text-base sm:text-lg font-extrabold leading-snug">${escapeHtml(ex.title)}</h3>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 py-2.5 px-3.5 bg-[var(--md-surface-container)] rounded-2xl text-xs tabular-nums">
              <div class="flex items-center gap-2 font-bold">
                <i data-lucide="calendar" class="w-4 h-4 text-[var(--md-primary)] shrink-0"></i>
                <span>${escapeHtml(countdown.prettyDate)}</span>
              </div>
              <div class="flex items-center gap-2 text-[var(--md-on-surface-variant)]">
                <i data-lucide="clock" class="w-4 h-4 text-[var(--md-primary)] shrink-0"></i>
                <span>${ex.start_time ? `${escapeHtml(ex.start_time)}${ex.end_time ? ' - ' + escapeHtml(ex.end_time) : ''}` : 'As per schedule'}</span>
              </div>
              <div class="flex items-center gap-2 text-[var(--md-on-surface-variant)]">
                <i data-lucide="map-pin" class="w-4 h-4 text-rose-600 shrink-0"></i>
                <span class="truncate">${escapeHtml(ex.room_or_hall || 'Main Examination Block')}</span>
              </div>
            </div>

            ${ex.syllabus ? `
              <div class="p-3.5 bg-amber-50/80 rounded-2xl border border-amber-200/70 text-xs text-amber-950 space-y-1">
                <div class="flex items-center gap-1.5 font-bold text-amber-900">
                  <i data-lucide="book-marked" class="w-3.5 h-3.5 text-amber-700"></i>
                  <span>Syllabus &amp; Instructions</span>
                </div>
                <p class="text-[11px] text-amber-900 leading-relaxed whitespace-pre-line">${escapeHtml(ex.syllabus)}</p>
              </div>
            ` : ''}

            <div class="pt-2 border-t border-[var(--md-outline)] flex items-center justify-between flex-wrap gap-2 text-xs">
              <span class="text-[11px] text-slate-500 flex items-center gap-1.5">
                Published by <strong>${escapeHtml(ex.author_name || 'Admin')}</strong>
                ${renderRoleBadgeHtml(ex.author_role, ex.author_teacher_type, ex.author_is_root_admin === 1)}
              </span>
              ${safeDrive ? `
                <a href="${escapeHtml(safeDrive)}" target="_blank" rel="noopener noreferrer"
                  class="m3-btn-tonal px-3.5 py-1.5 text-xs inline-flex items-center gap-1.5">
                  <i data-lucide="cloud-download" class="w-3.5 h-3.5"></i> Timetable PDF
                </a>
              ` : `<span class="text-[10px] text-slate-400 font-mono">ID: ${escapeHtml(ex.id)}</span>`}
            </div>
          </article>
        `;
      }).join('');

      initIcons();
    }

    document.querySelectorAll('.exam-type-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.exam-type-chip').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedType = btn.dataset.type;
        renderExams();
      });
    });

    searchInput.addEventListener('input', renderExams);
    classFilter.addEventListener('change', renderExams);

    if (user) loadExams();
  </script>
</body>
</html>
