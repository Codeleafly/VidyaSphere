<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Academic Q&amp;A Forum | VidyaSphere</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0b57d0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/css/custom.css">
</head>
<body class="bg-[var(--md-surface)] text-[var(--md-on-surface)] min-h-screen flex flex-col md:flex-row pb-20 md:pb-0 w-full">

  <main class="flex-1 w-full max-w-5xl mx-auto p-3.5 sm:p-6 lg:p-8 space-y-5">
    <div class="m3-tonal-box p-5 sm:p-6 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 border border-[var(--md-outline)]">
      <div>
        <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight">Academic Q&amp;A Forum</h1>
        <p class="text-xs text-[var(--md-on-surface-variant)]">Ask homework questions, get Teacher Verified replies, and Faculty Endorsed solutions</p>
      </div>
      <button id="open-ask-btn" class="m3-btn-primary w-full sm:w-auto px-5 py-2.5 text-xs flex items-center justify-center gap-2">
        <i data-lucide="help-circle" class="w-4 h-4"></i> Ask Question
      </button>
    </div>

    <div class="m3-card p-3.5 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2.5 w-full">
      <div class="relative">
        <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
        <input type="text" id="qa-search-input" placeholder="Search doubts..."
          class="m3-input w-full pl-9 pr-3 py-2 rounded-full border border-[var(--md-outline)] bg-[var(--md-surface)] text-xs sm:text-sm">
      </div>
      <select id="qa-class-filter" class="m3-input w-full px-3.5 py-2 rounded-full border border-[var(--md-outline)] text-xs sm:text-sm bg-white">
        <option value="">All Classes</option>
      </select>
      <select id="qa-subject-filter" class="m3-input w-full px-3.5 py-2 rounded-full border border-[var(--md-outline)] text-xs sm:text-sm bg-white">
        <option value="">All Subjects</option>
      </select>
      <select id="qa-status-filter" class="m3-input w-full px-3.5 py-2 rounded-full border border-[var(--md-outline)] text-xs sm:text-sm bg-white">
        <option value="">All Questions</option>
        <option value="resolved">Solved</option>
        <option value="unanswered">Unanswered</option>
      </select>
    </div>

    <div id="questions-list" class="space-y-3 w-full">
      <div class="m3-card p-8 text-center text-slate-400 text-xs">Loading Q&amp;A discussions...</div>
    </div>
  </main>

  <!-- Ask Question Modal -->
  <div id="ask-modal" class="m3-modal-backdrop fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs hidden items-center justify-center p-4">
    <div class="m3-modal-panel bg-white rounded-[28px] w-full max-w-lg p-5 space-y-3.5 shadow-2xl overflow-y-auto max-h-[90vh] modal-enter">
      <div class="m3-sheet-handle sm:hidden"></div>
      <div class="flex items-center justify-between pb-2 border-b border-slate-100">
        <h3 class="text-base font-extrabold">Ask a Question</h3>
        <button id="close-ask-modal" class="p-1.5 rounded-full hover:bg-slate-100 text-slate-500"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>
      <form id="ask-form" class="space-y-3">
        <div>
          <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1">Question Title</label>
          <input type="text" id="ask-title" required class="m3-input w-full px-3.5 py-2 rounded-2xl border border-[var(--md-outline)] text-xs sm:text-sm" placeholder="e.g. How to solve quadratic equations by factoring?">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1">Subject</label>
            <select id="ask-subject" required class="m3-input w-full px-2.5 py-2 rounded-2xl border border-[var(--md-outline)] text-xs bg-white"></select>
          </div>
          <div>
            <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1">Class</label>
            <select id="ask-class" required class="m3-input w-full px-2.5 py-2 rounded-2xl border border-[var(--md-outline)] text-xs bg-white"></select>
          </div>
        </div>
        <div>
          <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1">Problem Details</label>
          <textarea id="ask-desc" rows="3" required class="m3-input w-full px-3.5 py-2 rounded-2xl border border-[var(--md-outline)] text-xs sm:text-sm" placeholder="Explain what steps you tried..."></textarea>
        </div>
        <button type="submit" class="m3-btn-primary w-full py-3 text-xs sm:text-sm">Post Question</button>
      </form>
    </div>
  </div>

  <!-- Question Detail Modal -->
  <div id="detail-modal" class="m3-modal-backdrop fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs hidden items-center justify-center p-4">
    <div class="m3-modal-panel bg-white rounded-[28px] w-full max-w-2xl p-5 space-y-3.5 shadow-2xl max-h-[90vh] flex flex-col justify-between overflow-hidden modal-enter">
      <div class="m3-sheet-handle sm:hidden shrink-0"></div>
      <div class="flex items-center justify-between pb-2 border-b border-slate-100 shrink-0">
        <span id="detail-subject-badge" class="px-3 py-1 rounded-full text-[10px] font-bold uppercase bg-[var(--md-primary-container)] text-[var(--md-on-primary-container)]"></span>
        <div class="flex items-center gap-1.5">
          <button id="delete-question-btn" class="hidden px-3 py-1 rounded-full bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold text-xs">Delete</button>
          <button id="close-detail-modal" class="p-1.5 rounded-full hover:bg-slate-100 text-slate-500"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
      </div>

      <div class="overflow-y-auto space-y-3.5 pr-1 flex-1 break-words">
        <div>
          <h2 id="detail-title" class="text-base sm:text-lg font-extrabold leading-snug"></h2>
          <p class="text-[11px] text-slate-400 mt-1" id="detail-meta"></p>
          <div id="detail-desc" class="text-xs sm:text-sm text-[var(--md-on-surface-variant)] mt-2.5 whitespace-pre-line bg-[var(--md-surface-container)] p-3.5 rounded-2xl"></div>
        </div>

        <div class="space-y-2 pt-1">
          <h4 class="font-extrabold text-xs sm:text-sm flex items-center gap-1.5">
            <i data-lucide="message-circle" class="w-4 h-4 text-[var(--md-primary)]"></i> Answers
          </h4>
          <div id="answers-container" class="space-y-2"></div>
        </div>
      </div>

      <form id="answer-form" class="pt-3 border-t border-slate-100 flex gap-2 shrink-0">
        <input type="text" id="answer-text" required class="m3-input flex-1 px-4 py-2 rounded-full border border-[var(--md-outline)] text-xs sm:text-sm" placeholder="Write your answer...">
        <button type="submit" class="m3-btn-primary px-5 py-2 text-xs sm:text-sm">Reply</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { apiRequest } from '/js/api.js';
    import { initDashboardShell } from '/js/layout.js';
    import { CLASS_LIST, SUBJECT_LIST, escapeHtml, formatDate, renderRoleBadgeHtml, showToast, initIcons, bindModalBackdropAndEsc } from '/js/ui.js';

    const user = initDashboardShell({ active: 'qa', mobileTitle: 'Academic Q&A' });

    const questionsList = document.getElementById('questions-list');
    const searchInput = document.getElementById('qa-search-input');
    const classFilter = document.getElementById('qa-class-filter');
    const subjectFilter = document.getElementById('qa-subject-filter');
    const statusFilter = document.getElementById('qa-status-filter');
    const askModal = document.getElementById('ask-modal');
    const detailModal = document.getElementById('detail-modal');
    const delQuestionBtn = document.getElementById('delete-question-btn');
    let currentQuestionId = null;
    let currentQuestionAuthorId = null;

    SUBJECT_LIST.forEach(s => {
      subjectFilter.innerHTML += `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`;
      document.getElementById('ask-subject').innerHTML += `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`;
    });
    CLASS_LIST.forEach(c => {
      classFilter.innerHTML += `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`;
      document.getElementById('ask-class').innerHTML += `<option value="${escapeHtml(c)}" ${c === (user?.className || 'Class 10') ? 'selected' : ''}>${escapeHtml(c)}</option>`;
    });

    const closeAsk = () => { askModal.classList.add('hidden'); askModal.classList.remove('flex'); };
    const closeDetail = () => { detailModal.classList.add('hidden'); detailModal.classList.remove('flex'); };

    document.getElementById('open-ask-btn').addEventListener('click', () => { askModal.classList.remove('hidden'); askModal.classList.add('flex'); });
    document.getElementById('close-ask-modal').addEventListener('click', closeAsk);
    document.getElementById('close-detail-modal').addEventListener('click', closeDetail);
    bindModalBackdropAndEsc(askModal, closeAsk);
    bindModalBackdropAndEsc(detailModal, closeDetail);

    async function loadQuestions() {
      const params = new URLSearchParams();
      if (subjectFilter.value) params.append('subject', subjectFilter.value);
      if (classFilter.value) params.append('className', classFilter.value);
      if (statusFilter.value) params.append('status', statusFilter.value);
      if (searchInput.value.trim()) params.append('search', searchInput.value.trim());

      try {
        const res = await apiRequest(`/qa/questions?${params.toString()}`);
        const questions = res.questions || [];

        if (questions.length === 0) {
          questionsList.innerHTML = `<div class="m3-card p-10 text-center text-slate-400 text-xs">No questions asked yet.</div>`;
          return;
        }

        questionsList.innerHTML = questions.map(q => `
          <article class="m3-card m3-card-interactive p-5 space-y-2.5 cursor-pointer view-question-btn w-full break-words" data-id="${escapeHtml(q.id)}">
            <div class="flex items-center justify-between gap-2 flex-wrap">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase bg-[var(--md-primary-container)] text-[var(--md-on-primary-container)]">${escapeHtml(q.subject)}</span>
                <span class="text-[11px] text-slate-500 font-semibold">${escapeHtml(q.class_name)}</span>
                ${q.is_resolved ? '<span class="text-[10px] font-bold text-emerald-800 flex items-center gap-1 bg-emerald-100 px-2.5 py-0.5 rounded-full"><i data-lucide="check-circle" class="w-3 h-3"></i> Solved</span>' : ''}
              </div>
              <span class="text-[11px] text-slate-400 tabular-nums">${escapeHtml(formatDate(q.created_at))}</span>
            </div>
            <h3 class="font-extrabold text-sm sm:text-base leading-snug">${escapeHtml(q.title)}</h3>
            <p class="text-xs text-[var(--md-on-surface-variant)] line-clamp-2">${escapeHtml(q.description)}</p>
            <div class="pt-2 border-t border-[var(--md-outline)] flex items-center justify-between text-[11px] text-slate-500">
              <span class="flex items-center gap-1.5">Asked by <strong>${escapeHtml(q.author_name || 'Student')}</strong> ${renderRoleBadgeHtml(q.author_role, q.author_teacher_type, q.author_is_root_admin === 1)}</span>
              <span class="flex items-center gap-1 font-bold text-[var(--md-primary)] tabular-nums">
                <i data-lucide="message-square" class="w-3 h-3"></i> ${q.answer_count} Answers
              </span>
            </div>
          </article>
        `).join('');

        initIcons();
        questionsList.querySelectorAll('.view-question-btn').forEach(card => {
          card.addEventListener('click', () => openQuestionDetail(card.dataset.id));
        });
      } catch (err) {
        questionsList.innerHTML = `<div class="p-6 text-center text-rose-600 bg-rose-50 rounded-3xl text-xs">${escapeHtml(err.message)}</div>`;
      }
    }

    delQuestionBtn?.addEventListener('click', async () => {
      if (!currentQuestionId || !confirm('Delete this question and all answers?')) return;
      try {
        await apiRequest(`/qa/questions/${encodeURIComponent(currentQuestionId)}`, { method: 'DELETE' });
        showToast('Question deleted', 'info');
        closeDetail();
        loadQuestions();
      } catch (err) {
        showToast(err.message, 'error');
      }
    });

    async function openQuestionDetail(id) {
      currentQuestionId = id;
      try {
        const res = await apiRequest(`/qa/questions/${encodeURIComponent(id)}`);
        const q = res.question;
        const answers = res.answers || [];
        currentQuestionAuthorId = q.author_id;

        delQuestionBtn.classList.toggle('hidden', !(user && (user.id === q.author_id || user.role === 'admin')));
        document.getElementById('detail-subject-badge').textContent = `${q.subject} • ${q.class_name}`;
        document.getElementById('detail-title').textContent = q.title;
        document.getElementById('detail-meta').textContent = `Asked by ${q.author_name || 'Member'} on ${formatDate(q.created_at)}`;
        document.getElementById('detail-desc').textContent = q.description;

        const isFaculty = user && (user.role === 'teacher' || user.role === 'admin');
        const answersContainer = document.getElementById('answers-container');
        if (answers.length === 0) {
          answersContainer.innerHTML = '<p class="text-xs text-slate-400 italic py-2">No answers yet. Share your explanation below!</p>';
        } else {
          answersContainer.innerHTML = answers.map(ans => {
            const isAccepted = ans.is_accepted === 1;
            const isEndorsed = ans.is_faculty_endorsed === 1;
            const canAccept = user && (user.id === currentQuestionAuthorId || user.role === 'admin') && !isAccepted;
            const canDeleteAns = user && (user.id === ans.author_id || user.role === 'admin');
            return `
              <div class="p-3.5 rounded-2xl border ${isAccepted ? 'bg-emerald-50/70 border-emerald-300' : (isEndorsed ? 'bg-sky-50/70 border-sky-200' : 'bg-white border-[var(--md-outline)]')} space-y-1.5 break-words">
                <div class="flex items-center justify-between flex-wrap gap-1.5">
                  <div class="flex items-center gap-1.5 flex-wrap">
                    <span class="font-bold text-xs">${escapeHtml(ans.author_name || 'Peer')}</span>
                    ${ans.author_role === 'teacher' ? '<span class="px-2 py-0.5 rounded-full text-[9px] font-bold bg-[var(--md-primary-container)] text-[var(--md-on-primary-container)]">Teacher Verified</span>' : renderRoleBadgeHtml(ans.author_role, ans.author_teacher_type, ans.author_is_root_admin === 1)}
                    <span class="text-[10px] text-slate-400 tabular-nums">${escapeHtml(formatDate(ans.created_at))}</span>
                  </div>
                  <div class="flex items-center gap-2 flex-wrap">
                    ${isEndorsed ? '<span class="text-[10px] font-bold text-sky-800 bg-sky-100 px-2 py-0.5 rounded-full inline-flex items-center gap-1"><i data-lucide="award" class="w-3 h-3"></i> Faculty Endorsed</span>' : ''}
                    ${isAccepted ? '<span class="text-[10px] font-bold text-emerald-800 bg-emerald-100 px-2 py-0.5 rounded-full inline-flex items-center gap-1"><i data-lucide="check" class="w-3 h-3"></i> Accepted</span>' : ''}
                    ${canAccept ? `<button class="accept-btn text-xs text-[var(--md-primary)] hover:underline font-bold" data-ans-id="${escapeHtml(ans.id)}">Mark Accepted</button>` : ''}
                    ${isFaculty ? `<button class="endorse-btn text-xs text-sky-700 hover:underline font-bold" data-ans-id="${escapeHtml(ans.id)}" data-endorsed="${isEndorsed}">${isEndorsed ? 'Un-endorse' : 'Endorse'}</button>` : ''}
                    ${canDeleteAns ? `<button class="del-ans-btn text-xs text-rose-600 hover:underline font-bold" data-ans-id="${escapeHtml(ans.id)}">Delete</button>` : ''}
                  </div>
                </div>
                <p class="text-xs sm:text-sm text-[var(--md-on-surface-variant)] whitespace-pre-line leading-relaxed">${escapeHtml(ans.answer_text)}</p>
              </div>
            `;
          }).join('');

          answersContainer.querySelectorAll('.accept-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
              e.stopPropagation();
              try {
                await apiRequest(`/qa/answers/${encodeURIComponent(btn.dataset.ansId)}/accept`, { method: 'POST' });
                showToast('Marked as verified solution!', 'success');
                openQuestionDetail(currentQuestionId);
                loadQuestions();
              } catch (err) {
                showToast(err.message, 'error');
              }
            });
          });

          answersContainer.querySelectorAll('.endorse-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
              e.stopPropagation();
              const currentlyEndorsed = btn.dataset.endorsed === 'true';
              try {
                await apiRequest(`/qa/answers/${encodeURIComponent(btn.dataset.ansId)}/endorse`, {
                  method: 'POST',
                  body: { endorsed: !currentlyEndorsed }
                });
                showToast(currentlyEndorsed ? 'Endorsement removed' : 'Answer marked as Faculty Endorsed!', 'success');
                openQuestionDetail(currentQuestionId);
              } catch (err) {
                showToast(err.message, 'error');
              }
            });
          });

          answersContainer.querySelectorAll('.del-ans-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
              e.stopPropagation();
              if (!confirm('Delete this answer?')) return;
              try {
                await apiRequest(`/qa/answers/${encodeURIComponent(btn.dataset.ansId)}`, { method: 'DELETE' });
                showToast('Answer deleted', 'info');
                openQuestionDetail(currentQuestionId);
                loadQuestions();
              } catch (err) {
                showToast(err.message, 'error');
              }
            });
          });
        }

        detailModal.classList.remove('hidden');
        detailModal.classList.add('flex');
        initIcons();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    document.getElementById('ask-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await apiRequest('/qa/questions', {
          method: 'POST',
          body: {
            title: document.getElementById('ask-title').value.trim(),
            subject: document.getElementById('ask-subject').value,
            className: document.getElementById('ask-class').value,
            description: document.getElementById('ask-desc').value.trim(),
          },
        });
        showToast('Question posted!', 'success');
        closeAsk();
        e.target.reset();
        loadQuestions();
      } catch (err) {
        showToast(err.message, 'error');
      }
    });

    document.getElementById('answer-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('answer-text');
      const text = input.value.trim();
      if (!text || !currentQuestionId) return;
      try {
        await apiRequest(`/qa/questions/${encodeURIComponent(currentQuestionId)}/answers`, {
          method: 'POST',
          body: { answerText: text },
        });
        input.value = '';
        showToast('Answer submitted!', 'success');
        openQuestionDetail(currentQuestionId);
        loadQuestions();
      } catch (err) {
        showToast(err.message, 'error');
      }
    });

    searchInput.addEventListener('input', () => { clearTimeout(window._qaTimer); window._qaTimer = setTimeout(loadQuestions, 250); });
    classFilter.addEventListener('change', loadQuestions);
    subjectFilter.addEventListener('change', loadQuestions);
    statusFilter.addEventListener('change', loadQuestions);

    if (user) loadQuestions();
  </script>
</body>
</html>
