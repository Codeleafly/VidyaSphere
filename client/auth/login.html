<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="3XYEbXoLsICQETuhAq5vufhJyrxTf3h_AjqzEMpNzbs" />
  <meta name="description" content="Sign in to VidyaSphere Student Portal, Teacher Studio, or Admin Core.">
  <title>Sign In | VidyaSphere</title>
  <meta name="theme-color" content="#0b57d0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/css/custom.css">
  <script>
    (function() {
      try {
        var token = localStorage.getItem('vidyasphere_token');
        var userStr = localStorage.getItem('vidyasphere_user');
        if (token && userStr) {
          var user = JSON.parse(userStr);
          var target = user.accountStatus === 'pending'
            ? '/auth/pending.html'
            : (user.role === 'admin' ? '/admin/index.html' : (user.role === 'teacher' ? '/teacher/index.html' : '/dashboard/index.html'));
          window.location.replace(target);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body class="bg-[var(--md-surface)] text-[var(--md-on-surface)] min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md space-y-5">
    <div class="text-center">
      <a href="/index.html?landing=1" class="inline-flex items-center gap-2.5 font-extrabold text-xl tracking-tight">
        <span class="w-10 h-10 rounded-2xl bg-[var(--md-primary)] text-[var(--md-on-primary)] flex items-center justify-center shadow-sm">
          <i data-lucide="graduation-cap" class="w-5 h-5"></i>
        </span>
        VidyaSphere
      </a>
    </div>

    <div class="m3-card p-6 sm:p-8 space-y-5 shadow-lg shadow-slate-900/5">
      <div>
        <h1 class="text-2xl font-extrabold tracking-tight">Sign in</h1>
        <p class="text-xs text-[var(--md-on-surface-variant)] mt-1">Use your Student, Teacher, or Admin account</p>
      </div>

      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-[11px] font-bold uppercase tracking-wider text-[var(--md-on-surface-variant)] mb-1.5">Username</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
              <i data-lucide="user" class="w-4 h-4"></i>
            </span>
            <input type="text" id="username" required
              class="m3-input w-full pl-10 pr-4 py-3 rounded-2xl border border-[var(--md-outline)] bg-[var(--md-surface)] focus:bg-white text-sm transition"
              placeholder="e.g. aarav_10a_21" autofocus>
          </div>
        </div>

        <div>
          <label class="block text-[11px] font-bold uppercase tracking-wider text-[var(--md-on-surface-variant)] mb-1.5">Password</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
              <i data-lucide="key" class="w-4 h-4"></i>
            </span>
            <input type="password" id="password" required
              class="m3-input w-full pl-10 pr-10 py-3 rounded-2xl border border-[var(--md-outline)] bg-[var(--md-surface)] focus:bg-white text-sm transition"
              placeholder="••••••••">
            <button type="button" id="toggle-pw" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-700" title="Show/Hide Password">
              <i data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="submit-btn"
          class="m3-btn-primary w-full py-3 text-sm flex items-center justify-center gap-2">
          <span>Sign In</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </form>

      <div class="bg-[var(--md-surface-container)] rounded-2xl p-3 text-[11px] text-[var(--md-on-surface-variant)] flex items-center justify-center gap-1.5 font-medium">
        <i data-lucide="shield-check" class="w-4 h-4 text-emerald-600"></i>
        <span>256-Bit High-Entropy Session Auth</span>
      </div>

      <div class="border-t border-[var(--md-outline)] pt-4 text-center space-y-2 text-xs">
        <p class="text-[var(--md-on-surface-variant)]">
          New to VidyaSphere? <a href="/auth/register.html" class="font-bold text-[var(--md-primary)] hover:underline">Create Account</a>
        </p>
        <p>
          <a href="/guide.html" class="font-semibold text-[var(--md-on-surface-variant)] hover:text-[var(--md-primary)]">Read Platform Guide &rarr;</a>
        </p>
      </div>
    </div>
  </div>

  <script type="module">
    import { apiRequest } from '/js/api.js';
    import { saveSession, getHomeRouteForUser } from '/js/auth.js';
    import { showToast, initIcons } from '/js/ui.js';

    initIcons();

    const pwInput = document.getElementById('password');
    document.getElementById('toggle-pw')?.addEventListener('click', () => {
      pwInput.type = pwInput.type === 'password' ? 'text' : 'password';
    });

    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = pwInput.value;

      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-75');

      try {
        const res = await apiRequest('/auth/login', {
          method: 'POST',
          body: { username, password },
        });

        saveSession(res.token, res.user);

        if (res.isPending || res.user.accountStatus === 'pending') {
          showToast('Account pending approval. Redirecting...', 'info');
          setTimeout(() => window.location.replace('/auth/pending.html'), 450);
          return;
        }

        showToast('Login successful! Redirecting...', 'success');
        setTimeout(() => window.location.replace(getHomeRouteForUser(res.user)), 450);
      } catch (err) {
        showToast(err.message, 'error');
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-75');
      }
    });
  </script>
</body>
</html>
