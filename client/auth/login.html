<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | VidyaSphere</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/css/custom.css">
  <script>
    (function() {
      try {
        var token = localStorage.getItem('vidyasphere_token');
        var userStr = localStorage.getItem('vidyasphere_user');
        if (token && userStr) {
          var user = JSON.parse(userStr);
          var target = user.accountStatus === 'pending'
            ? '/auth/pending.html'
            : (user.role === 'admin' ? '/admin/index.html' : '/dashboard/index.html');
          window.location.replace(target);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md space-y-4">
    <div class="text-center">
      <a href="/index.html?landing=1" class="inline-flex items-center gap-2 text-slate-900 font-extrabold text-lg">
        <span class="w-9 h-9 rounded-xl bg-slate-900 text-white flex items-center justify-center shadow-sm">
          <i data-lucide="graduation-cap" class="w-5 h-5"></i>
        </span>
        VidyaSphere
      </a>
    </div>

    <div class="bg-white rounded-2xl shadow-[0_12px_32px_-16px_rgba(15,23,42,0.16)] border border-slate-200/80 overflow-hidden">
      <div class="p-6 sm:p-7 pb-0">
        <h1 class="text-xl font-extrabold text-slate-900">Sign in to your account</h1>
        <p class="text-xs text-slate-500 mt-1">Enter your VidyaSphere student or admin credentials</p>
      </div>

      <div class="p-6 sm:p-7 space-y-5">
        <form id="login-form" class="space-y-4">
          <div>
            <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1.5">Username</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                <i data-lucide="user" class="w-4 h-4"></i>
              </span>
              <input type="text" id="username" required
                class="w-full pl-9 pr-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50/50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-500 text-sm transition"
                placeholder="e.g. aarav_10a_21" autofocus>
            </div>
          </div>

          <div>
            <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1.5">Password</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                <i data-lucide="key" class="w-4 h-4"></i>
              </span>
              <input type="password" id="password" required
                class="w-full pl-9 pr-10 py-2.5 rounded-xl border border-slate-200 bg-slate-50/50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-500 text-sm transition"
                placeholder="••••••••">
              <button type="button" id="toggle-pw" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-700" title="Show/Hide Password">
                <i data-lucide="eye" class="w-4 h-4"></i>
              </button>
            </div>
          </div>

          <button type="submit" id="submit-btn"
            class="w-full py-2.5 rounded-xl bg-slate-900 hover:bg-indigo-600 text-white font-bold text-sm transition flex items-center justify-center gap-2">
            <span>Sign In</span>
            <i data-lucide="arrow-right" class="w-4 h-4"></i>
          </button>
        </form>

        <div class="bg-slate-50 border border-slate-200/70 rounded-xl p-2.5 text-[11px] text-slate-500 flex items-center justify-center gap-1.5">
          <i data-lucide="shield-check" class="w-3.5 h-3.5 text-emerald-600"></i>
          <span>256-Bit High-Entropy Session Auth</span>
        </div>

        <div class="border-t border-slate-100 pt-4 text-center space-y-2 text-xs">
          <p class="text-slate-500">
            New Student? <a href="/auth/register.html" class="font-bold text-indigo-600 hover:underline">Create Account</a>
          </p>
          <p>
            <a href="/guide.html" class="font-semibold text-slate-500 hover:text-indigo-600">Read Student Guide &rarr;</a>
          </p>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { apiRequest } from '/js/api.js';
    import { saveSession } from '/js/auth.js';
    import { showToast, initIcons } from '/js/ui.js';

    initIcons();

    const pwInput = document.getElementById('password');
    document.getElementById('toggle-pw')?.addEventListener('click', () => {
      pwInput.type = pwInput.type === 'password' ? 'text' : 'password';
    });

    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = pwInput.value;

      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-75');

      try {
        const res = await apiRequest('/auth/login', {
          method: 'POST',
          body: { username, password },
        });

        saveSession(res.token, res.user);

        if (res.isPending || res.user.accountStatus === 'pending') {
          showToast('Account pending admin approval. Redirecting...', 'info');
          setTimeout(() => window.location.replace('/auth/pending.html'), 500);
          return;
        }

        showToast('Login successful! Redirecting...', 'success');
        setTimeout(() => {
          window.location.replace(res.user.role === 'admin' ? '/admin/index.html' : '/dashboard/index.html');
        }, 500);
      } catch (err) {
        showToast(err.message, 'error');
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-75');
      }
    });
  </script>
</body>
</html>
