<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="3XYEbXoLsICQETuhAq5vufhJyrxTf3h_AjqzEMpNzbs" />
  <title>Create Account | VidyaSphere Registration</title>
  <meta name="description" content="Register on VidyaSphere as a Student or Faculty Member (Subject Teacher or Class Teacher) with instant role setup and fast approval tracking.">
  <meta name="robots" content="index, follow">
  <meta property="og:site_name" content="VidyaSphere">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Create Account | VidyaSphere Registration">
  <meta property="og:description" content="Join VidyaSphere Student Portal or Teacher Studio — choose your class, subjects, and faculty designation.">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Create Account | VidyaSphere">
  <meta name="twitter:description" content="Sign up as a VidyaSphere Student, Subject Teacher, or Class Teacher.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%230b57d0'/><text x='50' y='66' font-size='52' text-anchor='middle' fill='white'>🎓</text></svg>">
  <meta name="theme-color" content="#0b57d0">
  <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/css/custom.css">
  <script>
    (function() {
      try {
        var token = localStorage.getItem('vidyasphere_token');
        var userStr = localStorage.getItem('vidyasphere_user');
        if (token && userStr) {
          var user = JSON.parse(userStr);
          var target = user.accountStatus === 'pending'
            ? '/auth/pending.html'
            : (user.role === 'admin' ? '/admin/index.html' : (user.role === 'teacher' ? '/teacher/index.html' : '/dashboard/index.html'));
          window.location.replace(target);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body class="bg-[var(--md-surface)] text-[var(--md-on-surface)] min-h-screen py-8 px-4 flex items-center justify-center">

  <div class="w-full max-w-xl space-y-4">
    <div class="text-center">
      <a href="/index.html?landing=1" class="inline-flex items-center gap-2.5 font-extrabold text-xl tracking-tight">
        <span class="w-10 h-10 rounded-2xl bg-[var(--md-primary)] text-[var(--md-on-primary)] flex items-center justify-center shadow-sm">
          <i data-lucide="graduation-cap" class="w-5 h-5"></i>
        </span>
        VidyaSphere
      </a>
    </div>

    <div class="m3-card p-6 sm:p-8 space-y-5 shadow-lg shadow-slate-900/5">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div>
          <h1 class="text-xl font-extrabold tracking-tight">Create account</h1>
          <p class="text-xs text-[var(--md-on-surface-variant)] mt-0.5">No staff or invite codes needed — 1-click verification unlocks your portal.</p>
        </div>

        <!-- Material 3 Segmented Role Selector -->
        <div class="inline-flex p-1 rounded-full bg-[var(--md-surface-container)] border border-[var(--md-outline)] shrink-0 self-start">
          <button type="button" id="role-btn-student" class="px-4 py-1.5 rounded-full text-xs font-bold bg-[var(--md-secondary-container)] text-[var(--md-on-secondary-container)] transition">Student</button>
          <button type="button" id="role-btn-teacher" class="px-4 py-1.5 rounded-full text-xs font-semibold text-[var(--md-on-surface-variant)] transition">Teacher</button>
        </div>
      </div>

      <form id="register-form" class="space-y-4">
        <div>
          <label class="block text-[11px] font-bold uppercase tracking-wider text-[var(--md-on-surface-variant)] mb-1">Full Name</label>
          <input type="text" id="fullName" required
            class="m3-input w-full px-3.5 py-2.5 rounded-2xl border border-[var(--md-outline)] bg-[var(--md-surface)] focus:bg-white text-sm"
            placeholder="e.g. Aarav Patel">
        </div>

        <!-- STUDENT FIELDS -->
        <div id="student-fields" class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div>
            <label class="block text-[11px] font-bold uppercase tracking-wider text-[var(--md-on-surface-variant)] mb-1">Class / Grade</label>
            <select id="className" class="m3-input w-full px-3 py-2.5 rounded-2xl border border-[var(--md-outline)] bg-white text-sm"></select>
          </div>
          <div>
            <label class="block text-[11px] font-bold uppercase tracking-wider text-[var(--md-on-surface-variant)] mb-1">Division</label>
            <input type="text" id="division" maxlength="10"
              class="m3-input w-full px-3 py-2.5 rounded-2xl border border-[var(--md-outline)] bg-[var(--md-surface)] focus:bg-white text-sm uppercase text-center"
              placeholder="A">
          </div>
          <div>
            <label class="block text-[11px] font-bold uppercase tracking-wider text-[var(--md-on-surface-variant)] mb-1">Roll Number</label>
            <input type="text" id="rollNumber"
              class="m3-input w-full px-3 py-2.5 rounded-2xl border border-[var(--md-outline)] bg-[var(--md-surface)] focus:bg-white text-sm text-center"
              placeholder="21">
          </div>
        </div>

        <!-- TEACHER FIELDS -->
        <div id="teacher-fields" class="hidden space-y-4 p-4 rounded-3xl bg-[var(--md-surface-container)] border border-[var(--md-outline)]">
          <div class="space-y-1.5">
            <label class="block text-[11px] font-bold uppercase tracking-wider text-[var(--md-on-surface-variant)]">Teacher Role Type</label>
            <div class="grid grid-cols-2 gap-2 text-xs">
              <label id="t-type-card-subject" class="cursor-pointer p-3 rounded-2xl bg-white border-2 border-[var(--md-primary)] flex items-center gap-2 transition">
                <input type="radio" name="teacherType" value="subject" checked>
                <span><strong>Subject Teacher</strong><br><span class="text-[10px] text-slate-500">Teach multiple classes</span></span>
              </label>
              <label id="t-type-card-class" class="cursor-pointer p-3 rounded-2xl bg-white border border-[var(--md-outline)] flex items-center gap-2 transition">
                <input type="radio" name="teacherType" value="class">
                <span><strong>Class Teacher</strong><br><span class="text-[10px] text-slate-500">Approve class students &amp; tests</span></span>
              </label>
            </div>
          </div>

          <div id="class-teacher-primary-row" class="hidden grid grid-cols-1 sm:grid-cols-2 gap-2.5">
            <div>
              <label class="block text-[11px] font-bold uppercase tracking-wider text-[var(--md-on-surface-variant)] mb-1">Assigned Home Class</label>
              <select id="tPrimaryClass" class="m3-input w-full px-3 py-2 rounded-2xl border border-[var(--md-outline)] bg-white text-xs"></select>
            </div>
            <div>
              <label class="block text-[11px] font-bold uppercase tracking-wider text-[var(--md-on-surface-variant)] mb-1">Division <span class="font-normal lowercase">(optional)</span></label>
              <input type="text" id="tDivision" maxlength="10" class="m3-input w-full px-3 py-2 rounded-2xl border border-[var(--md-outline)] bg-white text-xs uppercase" placeholder="e.g. A (or leave blank)">
            </div>
          </div>

          <div>
            <label class="block text-[11px] font-bold uppercase tracking-wider text-[var(--md-on-surface-variant)] mb-1.5">Assigned Classes (Tap to select)</label>
            <div id="t-classes-chips" class="flex flex-wrap gap-1.5"></div>
          </div>

          <div>
            <label class="block text-[11px] font-bold uppercase tracking-wider text-[var(--md-on-surface-variant)] mb-1.5">Assigned Subjects (Tap to select)</label>
            <div id="t-subjects-chips" class="flex flex-wrap gap-1.5 max-h-36 overflow-y-auto p-1"></div>
          </div>

          <!-- Extra Teacher Verification Information -->
          <div class="pt-2 border-t border-[var(--md-outline)] space-y-3">
            <div>
              <label class="block text-[11px] font-bold uppercase tracking-wider text-[var(--md-on-surface-variant)] mb-1">
                Qualification / Designation <span class="font-normal lowercase text-slate-400">(optional)</span>
              </label>
              <input type="text" id="teacherDesignation" maxlength="140"
                class="m3-input w-full px-3.5 py-2 rounded-2xl border border-[var(--md-outline)] bg-white text-xs"
                placeholder="e.g. M.Sc. Physics, B.Ed • Senior Science Faculty">
            </div>
            <div>
              <label class="block text-[11px] font-bold uppercase tracking-wider text-[var(--md-on-surface-variant)] mb-1">
                Role Purpose &amp; Additional Info <span class="font-normal lowercase text-slate-400">(helps Admin verify faster)</span>
              </label>
              <textarea id="teacherInfo" rows="2" maxlength="600"
                class="m3-input w-full px-3.5 py-2 rounded-2xl border border-[var(--md-outline)] bg-white text-xs"
                placeholder="Briefly explain what you teach or will manage (e.g. Class 9-10 Algebra lessons, weekly MCQ quizzes, lab supervision)..."></textarea>
            </div>
          </div>
        </div>

        <div>
          <label class="block text-[11px] font-bold uppercase tracking-wider text-[var(--md-on-surface-variant)] mb-1">Choose Username</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 font-mono text-sm">@</span>
            <input type="text" id="username" required minlength="3" maxlength="20"
              class="m3-input w-full pl-8 pr-4 py-2.5 rounded-2xl border border-[var(--md-outline)] bg-[var(--md-surface)] focus:bg-white text-sm font-mono lowercase"
              placeholder="aarav_patel10">
          </div>
          <p class="text-[10px] text-slate-400 mt-1">Letters, numbers, and underscores (3–20 characters).</p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-[11px] font-bold uppercase tracking-wider text-[var(--md-on-surface-variant)] mb-1">Create Password</label>
            <div class="relative">
              <input type="password" id="password" required minlength="6"
                class="m3-input w-full px-3.5 pr-9 py-2.5 rounded-2xl border border-[var(--md-outline)] bg-[var(--md-surface)] focus:bg-white text-sm"
                placeholder="Min 6 characters">
              <button type="button" id="toggle-reg-pw" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-700" title="Show/Hide">
                <i data-lucide="eye" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
          <div>
            <label class="block text-[11px] font-bold uppercase tracking-wider text-[var(--md-on-surface-variant)] mb-1">Confirm Password</label>
            <input type="password" id="confirmPassword" required minlength="6"
              class="m3-input w-full px-3.5 py-2.5 rounded-2xl border border-[var(--md-outline)] bg-[var(--md-surface)] focus:bg-white text-sm"
              placeholder="Re-enter password">
          </div>
        </div>

        <div>
          <label class="block text-[11px] font-bold uppercase tracking-wider text-[var(--md-on-surface-variant)] mb-1">
            Email Address <span class="text-slate-400 font-normal lowercase">(optional)</span>
          </label>
          <input type="email" id="email"
            class="m3-input w-full px-3.5 py-2.5 rounded-2xl border border-[var(--md-outline)] bg-[var(--md-surface)] focus:bg-white text-sm"
            placeholder="name@school.edu">
        </div>

        <button type="submit" id="submit-btn"
          class="m3-btn-primary w-full py-3 text-sm flex items-center justify-center gap-2">
          <i data-lucide="check-circle" class="w-4 h-4"></i>
          <span>Create Account &amp; Submit</span>
        </button>
      </form>

      <div class="border-t border-[var(--md-outline)] pt-3 flex items-center justify-between text-xs">
        <a href="/auth/login.html" class="font-bold text-[var(--md-primary)] hover:underline">
          Already have an account? Sign In &rarr;
        </a>
        <a href="/guide.html" class="font-semibold text-[var(--md-on-surface-variant)] hover:text-[var(--md-primary)]">
          Guide
        </a>
      </div>
    </div>
  </div>

  <script type="module">
    import { apiRequest } from '/js/api.js';
    import { setAuthToken, setCurrentUser } from '/js/auth.js';
    import { CLASS_LIST, SUBJECT_LIST, escapeHtml, showToast, initIcons } from '/js/ui.js';

    initIcons();

    const pwInput = document.getElementById('password');
    document.getElementById('toggle-reg-pw')?.addEventListener('click', () => {
      pwInput.type = pwInput.type === 'password' ? 'text' : 'password';
    });

    let selectedRole = 'student';
    const selectedClasses = new Set();
    const selectedSubjects = new Set();

    const classSel = document.getElementById('className');
    const tPrimarySel = document.getElementById('tPrimaryClass');
    CLASS_LIST.forEach(c => {
      classSel.innerHTML += `<option value="${escapeHtml(c)}" ${c === 'Class 10' ? 'selected' : ''}>${escapeHtml(c)}</option>`;
      tPrimarySel.innerHTML += `<option value="${escapeHtml(c)}" ${c === 'Class 10' ? 'selected' : ''}>${escapeHtml(c)}</option>`;
    });

    function buildChips(containerId, items, setRef) {
      const el = document.getElementById(containerId);
      el.innerHTML = items.map(item => `
        <button type="button" class="m3-chip px-3 py-1 text-[11px] font-semibold" data-val="${escapeHtml(item)}">${escapeHtml(item)}</button>
      `).join('');
      el.querySelectorAll('.m3-chip').forEach(btn => {
        btn.addEventListener('click', () => {
          const val = btn.dataset.val;
          if (setRef.has(val)) {
            setRef.delete(val);
            btn.classList.remove('active');
          } else {
            setRef.add(val);
            btn.classList.add('active');
          }
        });
      });
    }
    buildChips('t-classes-chips', CLASS_LIST, selectedClasses);
    buildChips('t-subjects-chips', SUBJECT_LIST, selectedSubjects);

    const studentFields = document.getElementById('student-fields');
    const teacherFields = document.getElementById('teacher-fields');
    const btnStu = document.getElementById('role-btn-student');
    const btnTch = document.getElementById('role-btn-teacher');

    function setRoleMode(role) {
      selectedRole = role;
      const isTeacher = role === 'teacher';
      studentFields.classList.toggle('hidden', isTeacher);
      teacherFields.classList.toggle('hidden', !isTeacher);
      btnStu.className = !isTeacher
        ? 'px-4 py-1.5 rounded-full text-xs font-bold bg-[var(--md-secondary-container)] text-[var(--md-on-secondary-container)] transition'
        : 'px-4 py-1.5 rounded-full text-xs font-semibold text-[var(--md-on-surface-variant)] transition';
      btnTch.className = isTeacher
        ? 'px-4 py-1.5 rounded-full text-xs font-bold bg-[var(--md-secondary-container)] text-[var(--md-on-secondary-container)] transition'
        : 'px-4 py-1.5 rounded-full text-xs font-semibold text-[var(--md-on-surface-variant)] transition';
      document.getElementById('fullName').placeholder = isTeacher ? 'e.g. Prof. Sunita Verma' : 'e.g. Aarav Patel';
    }

    btnStu.addEventListener('click', () => setRoleMode('student'));
    btnTch.addEventListener('click', () => setRoleMode('teacher'));

    const cardSub = document.getElementById('t-type-card-subject');
    const cardCls = document.getElementById('t-type-card-class');
    document.querySelectorAll('input[name="teacherType"]').forEach(r => {
      r.addEventListener('change', (e) => {
        const isCls = e.target.value === 'class';
        document.getElementById('class-teacher-primary-row').classList.toggle('hidden', !isCls);
        cardSub.className = `cursor-pointer p-3 rounded-2xl bg-white ${!isCls ? 'border-2 border-[var(--md-primary)]' : 'border border-[var(--md-outline)]'} flex items-center gap-2 transition`;
        cardCls.className = `cursor-pointer p-3 rounded-2xl bg-white ${isCls ? 'border-2 border-[var(--md-primary)]' : 'border border-[var(--md-outline)]'} flex items-center gap-2 transition`;
      });
    });

    const form = document.getElementById('register-form');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const password = pwInput.value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      if (password !== confirmPassword) {
        showToast('Passwords do not match.', 'error');
        return;
      }

      const payload = {
        role: selectedRole,
        fullName: document.getElementById('fullName').value.trim(),
        username: document.getElementById('username').value.trim().toLowerCase(),
        password,
        email: document.getElementById('email').value.trim() || null,
      };

      if (selectedRole === 'student') {
        payload.className = document.getElementById('className').value;
        payload.division = document.getElementById('division').value.trim().toUpperCase();
        payload.rollNumber = document.getElementById('rollNumber').value.trim();
        if (!payload.className || !payload.division || !payload.rollNumber) {
          showToast('Please fill Class, Division, and Roll Number', 'warning');
          return;
        }
      } else {
        const tType = document.querySelector('input[name="teacherType"]:checked')?.value || 'subject';
        const classesArr = Array.from(selectedClasses);
        if (tType === 'class') {
          payload.className = document.getElementById('tPrimaryClass').value;
          payload.division = document.getElementById('tDivision').value.trim().toUpperCase();
          if (payload.className && !classesArr.includes(payload.className)) {
            classesArr.unshift(payload.className);
          }
        }
        payload.teacherType = tType;
        payload.assignedClasses = classesArr;
        payload.assignedSubjects = Array.from(selectedSubjects);
        payload.teacherDesignation = document.getElementById('teacherDesignation').value.trim();
        payload.teacherInfo = document.getElementById('teacherInfo').value.trim();

        if (payload.assignedClasses.length === 0) {
          showToast('Select at least one assigned class', 'warning');
          return;
        }
        if (payload.assignedSubjects.length === 0) {
          showToast('Select at least one assigned subject', 'warning');
          return;
        }
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account...';

      try {
        const res = await apiRequest('/auth/register', { method: 'POST', body: payload });
        if (res.token) {
          setAuthToken(res.token);
          setCurrentUser(res.user);
        }
        showToast('Account created! Awaiting approval.', 'success');
        setTimeout(() => window.location.replace('/auth/pending.html'), 450);
      } catch (err) {
        showToast(err.message, 'error');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i data-lucide="check-circle" class="w-4 h-4"></i><span>Create Account &amp; Submit</span>';
        initIcons();
      }
    });
  </script>
</body>
</html>
