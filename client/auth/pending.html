<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="3XYEbXoLsICQETuhAq5vufhJyrxTf3h_AjqzEMpNzbs" />
  <title>Approval Pending | VidyaSphere</title>
  <meta name="description" content="Your VidyaSphere account is awaiting admin or class teacher approval.">
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:title" content="Approval Pending | VidyaSphere">
  <meta property="og:description" content="Account verification queue on VidyaSphere.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%230b57d0'/><text x='50' y='66' font-size='52' text-anchor='middle' fill='white'>🎓</text></svg>">
  <meta name="theme-color" content="#0b57d0">
  <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/css/custom.css">
</head>
<body class="bg-[var(--md-surface)] text-[var(--md-on-surface)] min-h-screen py-8 px-4 flex items-center justify-center">

  <div class="w-full max-w-md m3-card overflow-hidden shadow-lg shadow-slate-900/5">
    <div class="bg-[var(--md-surface-container)] p-6 text-center space-y-2 border-b border-[var(--md-outline)]">
      <div class="w-12 h-12 bg-amber-100 text-amber-800 rounded-2xl flex items-center justify-center mx-auto">
        <i data-lucide="clock" class="w-6 h-6"></i>
      </div>
      <h1 class="text-xl font-extrabold">Approval Pending</h1>
      <p class="text-xs text-[var(--md-on-surface-variant)]">1-click verification in progress</p>
    </div>

    <div class="p-6 sm:p-7 space-y-5 text-center">
      <div class="bg-[var(--md-surface-container)] rounded-2xl p-4 text-left space-y-2">
        <div class="flex items-center justify-between">
          <span class="text-[10px] font-bold uppercase tracking-wider text-slate-500">Account Profile</span>
          <span id="live-badge" class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-amber-100 text-amber-800 flex items-center gap-1">
            <span class="w-1.5 h-1.5 rounded-full bg-amber-600 animate-ping"></span> Pending Review
          </span>
        </div>
        <h3 id="student-name" class="font-extrabold text-base truncate">Loading...</h3>
        <div class="text-xs text-slate-600 flex items-center gap-2 flex-wrap">
          <span class="font-mono text-[var(--md-primary)] font-bold bg-white px-2.5 py-0.5 rounded-full border border-[var(--md-outline)]" id="student-username">@-</span>
          <span id="student-class" class="text-[var(--md-on-surface-variant)]">-</span>
        </div>
      </div>

      <div id="pending-info-box" class="p-4 rounded-2xl bg-amber-50 border border-amber-200/80 text-left text-xs text-amber-950 space-y-1">
        <p class="font-bold flex items-center gap-1.5">
          <i data-lucide="shield-check" class="w-4 h-4 text-amber-700"></i> Profile &amp; Password Saved
        </p>
        <p class="text-[11px] text-amber-900 leading-relaxed">
          As soon as your School Admin (or Class Teacher for students) taps Approve, this screen automatically unlocks your portal.
        </p>
      </div>

      <div class="py-1 flex items-center justify-center gap-2 text-xs text-slate-500 font-medium">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
        <span id="poll-status-text">Checking approval status in real time...</span>
      </div>

      <div class="space-y-2">
        <button id="manual-check-btn" class="m3-btn-primary w-full py-2.5 text-xs flex items-center justify-center gap-1.5">
          <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Check Status Now
        </button>
        <button id="logout-btn" class="w-full py-2.5 rounded-full bg-[var(--md-surface-container)] hover:brightness-95 text-[var(--md-on-surface)] font-bold text-xs transition">
          Sign Out / Switch Account
        </button>
      </div>
    </div>
  </div>

  <script type="module">
    import { apiRequest } from '/js/api.js';
    import { getAuthToken, getCurrentUser, setCurrentUser, getHomeRouteForUser, logout } from '/js/auth.js';
    import { showToast, initIcons, escapeHtml } from '/js/ui.js';

    initIcons();

    if (!getAuthToken()) {
      window.location.replace('/auth/login.html');
    }

    function renderProfileSummary(u) {
      document.getElementById('student-name').textContent = u.fullName || u.username;
      document.getElementById('student-username').textContent = `@${u.username}`;
      if (u.role === 'teacher') {
        const typeTxt = u.teacherType === 'class' ? 'Class Teacher' : 'Subject Teacher';
        const extra = u.teacherDesignation ? ` • ${u.teacherDesignation}` : '';
        document.getElementById('student-class').textContent = `${typeTxt}${extra}`;
      } else {
        document.getElementById('student-class').textContent = `${u.className || ''} ${u.division ? '- Div ' + u.division : ''} (Roll: ${u.rollNumber || '-'})`;
      }
    }

    const localUser = getCurrentUser();
    if (localUser) renderProfileSummary(localUser);

    let isChecking = false;

    async function checkApprovalStatus(showNotification = false) {
      if (isChecking) return;
      isChecking = true;
      const statusText = document.getElementById('poll-status-text');

      try {
        const res = await apiRequest('/auth/me');
        if (res.user) {
          setCurrentUser(res.user);
          renderProfileSummary(res.user);

          if (res.user.accountStatus === 'active') {
            statusText.textContent = 'Approved! Unlocking your workspace...';
            const badge = document.getElementById('live-badge');
            badge.className = 'px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800';
            badge.textContent = 'Approved & Active';
            showToast('Account Approved! Welcome to VidyaSphere.', 'success');
            setTimeout(() => window.location.replace(getHomeRouteForUser(res.user)), 500);
            return;
          }

          if (res.user.accountStatus === 'rejected') {
            statusText.textContent = 'Application was rejected.';
            const badge = document.getElementById('live-badge');
            badge.className = 'px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-rose-100 text-rose-800';
            badge.textContent = 'Rejected';
            const infoBox = document.getElementById('pending-info-box');
            infoBox.className = 'p-4 rounded-2xl bg-rose-50 border border-rose-200 text-left text-xs text-rose-900 space-y-1';
            infoBox.innerHTML = `<p class="font-bold">Application Rejected</p><p>${escapeHtml(res.user.rejectionReason || 'Details did not match school records.')}</p>`;
            if (showNotification) showToast('Registration request was rejected.', 'error');
            return;
          }

          if (showNotification) {
            showToast('Still pending review. Please wait a moment.', 'info');
          }
        }
      } catch (err) {
        if (err.message.includes('401') || err.message.includes('expired')) {
          logout();
          return;
        }
      } finally {
        isChecking = false;
      }
    }

    const pollInterval = setInterval(() => checkApprovalStatus(false), 4000);
    checkApprovalStatus(false);

    document.getElementById('manual-check-btn').addEventListener('click', () => checkApprovalStatus(true));
    document.getElementById('logout-btn').addEventListener('click', () => {
      clearInterval(pollInterval);
      logout();
    });
  </script>
</body>
</html>
