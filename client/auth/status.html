<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Application Status & Activation | VidyaSphere</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/css/custom.css">
</head>
<body class="bg-slate-50 min-h-screen py-8 px-4 flex items-center justify-center">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
    <!-- Header -->
    <div class="bg-gradient-to-r from-indigo-600 to-violet-600 p-6 text-white text-center">
      <div class="w-12 h-12 bg-white/10 rounded-xl flex items-center justify-center mx-auto mb-3 backdrop-blur">
        <i data-lucide="search" class="w-6 h-6"></i>
      </div>
      <h1 class="text-2xl font-bold">Track Application Status</h1>
      <p class="text-xs text-indigo-100 mt-1">Check account verification status and unlock your student dashboard</p>
    </div>

    <div class="p-6 sm:p-8 space-y-6">
      <!-- Search Box -->
      <form id="track-form" class="space-y-3">
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600">Enter Tracking Token</label>
        <div class="flex gap-2">
          <input type="text" id="token-input" required
            class="flex-1 px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-mono"
            placeholder="track_xxxxxxxx">
          <button type="submit"
            class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-sm transition">
            Check
          </button>
        </div>
      </form>

      <!-- Status Result Area -->
      <div id="status-card" class="hidden border border-slate-200 rounded-xl p-4 bg-slate-50 space-y-4">
        <div class="flex items-center justify-between pb-3 border-b border-slate-200">
          <div>
            <h3 id="res-name" class="font-bold text-slate-800 text-base"></h3>
            <p id="res-class" class="text-xs text-slate-500"></p>
          </div>
          <span id="res-status-badge" class="px-2.5 py-1 rounded-full text-xs font-bold uppercase"></span>
        </div>

        <div id="status-details" class="text-xs text-slate-600 space-y-2"></div>

        <!-- Claim Box if Approved -->
        <div id="claim-section" class="hidden pt-3 border-t border-slate-200">
          <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-4 space-y-3">
            <div class="flex items-center gap-2 text-emerald-800 font-bold text-sm">
              <i data-lucide="check-circle" class="w-4 h-4"></i> Application Approved!
            </div>
            <p class="text-xs text-emerald-700">
              Assigned Username: <code id="assigned-username" class="font-bold bg-white px-1.5 py-0.5 rounded border border-emerald-300"></code>
            </p>
            <button id="open-activation-btn"
              class="w-full py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs uppercase tracking-wider shadow-sm transition">
              Claim Account & Set Password
            </button>
          </div>
        </div>
      </div>

      <div class="border-t border-slate-100 pt-4 text-center">
        <a href="/auth/login.html" class="text-xs font-bold text-indigo-600 hover:underline">
          &larr; Back to Sign In
        </a>
      </div>
    </div>
  </div>

  <!-- Account Activation Modal -->
  <div id="activation-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center p-3 sm:p-4">
    <div class="bg-white rounded-2xl w-full max-w-[95vw] sm:max-w-md p-4 sm:p-6 space-y-3.5 shadow-2xl overflow-hidden">
      <div class="flex items-center justify-between pb-2 border-b border-slate-100">
        <h3 class="text-base sm:text-lg font-bold text-slate-900">Activate Your Account</h3>
        <button id="close-modal" class="text-slate-400 hover:text-slate-600 text-xl font-bold p-1">&times;</button>
      </div>
      <p class="text-xs text-slate-600">
        Enter the 6-digit Activation Code issued by the school administration, and choose your new password.
      </p>

      <form id="activation-form" class="space-y-3">
        <div>
          <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-600 mb-1">Activation Code</label>
          <input type="text" id="act-code" required maxlength="6"
            class="w-full px-3 py-2.5 rounded-xl border border-slate-300 uppercase tracking-widest font-mono text-center font-bold text-lg focus:ring-2 focus:ring-indigo-500"
            placeholder="e.g. 7X9K2P">
        </div>

        <div>
          <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-600 mb-1">New Password (Min 6 chars)</label>
          <input type="password" id="act-password" required minlength="6"
            class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs sm:text-sm focus:ring-2 focus:ring-indigo-500"
            placeholder="••••••••">
        </div>

        <button type="submit" id="act-submit-btn"
          class="w-full py-2.5 sm:py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs sm:text-sm shadow-md shadow-indigo-100 transition">
          Complete Activation & Sign In
        </button>
      </form>
    </div>
  </div>

  <script type="module">
    import { apiRequest } from '/js/api.js';
    import { saveSession } from '/js/auth.js';
    import { showToast, formatDate, initIcons } from '/js/ui.js';

    initIcons();

    const trackForm = document.getElementById('track-form');
    const tokenInput = document.getElementById('token-input');
    const statusCard = document.getElementById('status-card');
    const resName = document.getElementById('res-name');
    const resClass = document.getElementById('res-class');
    const resBadge = document.getElementById('res-status-badge');
    const statusDetails = document.getElementById('status-details');
    const claimSection = document.getElementById('claim-section');
    const assignedUsernameEl = document.getElementById('assigned-username');

    const activationModal = document.getElementById('activation-modal');
    const openActivationBtn = document.getElementById('open-activation-btn');
    const closeModal = document.getElementById('close-modal');
    const activationForm = document.getElementById('activation-form');

    // Auto-fill token from URL or localStorage
    const urlParams = new URLSearchParams(window.location.search);
    const tokenFromUrl = urlParams.get('token') || localStorage.getItem('vidyasphere_tracking_token');
    if (tokenFromUrl) {
      tokenInput.value = tokenFromUrl;
      checkStatus(tokenFromUrl);
    }

    trackForm.addEventListener('submit', (e) => {
      e.preventDefault();
      checkStatus(tokenInput.value.trim());
    });

    async function checkStatus(token) {
      if (!token) return;
      try {
        const res = await apiRequest(`/auth/status?token=${encodeURIComponent(token)}`);
        statusCard.classList.remove('hidden');

        resName.textContent = res.fullName;
        resClass.textContent = `${res.className} - Div ${res.division} (Roll: ${res.rollNumber})`;

        const statusBadges = {
          pending: 'bg-amber-100 text-amber-700 border border-amber-200',
          approved: 'bg-emerald-100 text-emerald-700 border border-emerald-200',
          rejected: 'bg-rose-100 text-rose-700 border border-rose-200',
        };

        resBadge.className = `px-2.5 py-1 rounded-full text-xs font-bold uppercase ${statusBadges[res.reviewStatus] || 'bg-slate-100'}`;
        resBadge.textContent = res.reviewStatus;

        let detailHtml = `<p><strong>Applied on:</strong> ${formatDate(res.createdAt)}</p>`;
        if (res.reviewStatus === 'pending') {
          detailHtml += `<p class="text-amber-700">Your application is awaiting review by the school administration office.</p>`;
          claimSection.classList.add('hidden');
        } else if (res.reviewStatus === 'approved') {
          detailHtml += `<p class="text-emerald-700">Congratulations! Your application has been approved by the school.</p>`;
          if (res.activation && res.activation.canActivate) {
            claimSection.classList.remove('hidden');
            assignedUsernameEl.textContent = res.activation.assignedUsername;
          } else {
            const uName = (res.activation && res.activation.assignedUsername) ? res.activation.assignedUsername : 'Check with Lead Admin';
            detailHtml += `
              <div class="mt-2 p-3.5 bg-emerald-50 border border-emerald-200 rounded-xl space-y-2">
                <p class="text-xs text-emerald-800 font-bold flex items-center gap-1.5">
                  <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-600"></i> Account Already Activated & Ready!
                </p>
                <p class="text-xs text-slate-700">
                  Your Login Username: <code class="font-mono font-bold bg-white px-2 py-1 rounded border border-emerald-300 text-indigo-700 select-all">${uName}</code>
                </p>
                <div class="pt-1">
                  <a href="/auth/login.html" class="inline-flex items-center gap-1 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold text-xs shadow-sm transition">
                    👉 Go to Sign In
                  </a>
                </div>
              </div>
            `;
            claimSection.classList.add('hidden');
          }
        } else if (res.reviewStatus === 'rejected') {
          detailHtml += `<p class="text-rose-700"><strong>Reason:</strong> ${res.reviewReason || 'Application details did not match official school records.'}</p>`;
          claimSection.classList.add('hidden');
        }

        statusDetails.innerHTML = detailHtml;
        initIcons();
      } catch (err) {
        showToast(err.message, 'error');
        statusCard.classList.add('hidden');
      }
    }

    openActivationBtn.addEventListener('click', () => {
      activationModal.classList.remove('hidden');
      activationModal.classList.add('flex');
    });

    closeModal.addEventListener('click', () => {
      activationModal.classList.add('hidden');
      activationModal.classList.remove('flex');
    });

    activationForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const code = document.getElementById('act-code').value.trim();
      const password = document.getElementById('act-password').value;

      try {
        const res = await apiRequest('/auth/activate', {
          method: 'POST',
          body: { code, password },
        });

        saveSession(res.token, res.user);
        showToast('Account activated successfully! Redirecting to Dashboard...', 'success');

        setTimeout(() => {
          window.location.href = '/dashboard/index.html';
        }, 1000);
      } catch (err) {
        showToast(err.message, 'error');
      }
    });
  </script>
</body>
</html>
