<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="3XYEbXoLsICQETuhAq5vufhJyrxTf3h_AjqzEMpNzbs" />
  <title>Account Status Checker | VidyaSphere</title>
  <meta name="description" content="Check whether your VidyaSphere student or teacher registration has been approved and is ready to sign in.">
  <meta name="robots" content="index, follow">
  <meta property="og:site_name" content="VidyaSphere">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Account Status Checker | VidyaSphere">
  <meta property="og:description" content="Verify live approval status for your VidyaSphere registration.">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Account Status | VidyaSphere">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%230b57d0'/><text x='50' y='66' font-size='52' text-anchor='middle' fill='white'>🎓</text></svg>">
  <meta name="theme-color" content="#0b57d0">
  <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/css/custom.css">
  <script>
    (function() {
      try {
        var token = localStorage.getItem('vidyasphere_token');
        var userStr = localStorage.getItem('vidyasphere_user');
        if (token && userStr) {
          var user = JSON.parse(userStr);
          var target = user.accountStatus === 'pending'
            ? '/auth/pending.html'
            : (user.role === 'admin' ? '/admin/index.html' : (user.role === 'teacher' ? '/teacher/index.html' : '/dashboard/index.html'));
          window.location.replace(target);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body class="bg-[var(--md-surface)] text-[var(--md-on-surface)] min-h-screen p-4 flex items-center justify-center">
  <div class="w-full max-w-md m3-card p-7 text-center space-y-5 shadow-lg shadow-slate-900/5">
    <div class="w-12 h-12 rounded-2xl bg-[var(--md-primary-container)] text-[var(--md-on-primary-container)] flex items-center justify-center mx-auto">
      <i data-lucide="sparkles" class="w-6 h-6"></i>
    </div>
    <div class="space-y-1.5">
      <h1 class="text-xl font-extrabold">1-Click Verification Active</h1>
      <p class="text-xs text-[var(--md-on-surface-variant)] leading-relaxed">
        Sign in with the username and password you created during registration to check your Student or Teacher approval status in real time.
      </p>
    </div>
    <div class="space-y-2.5 pt-1">
      <a href="/auth/login.html" class="m3-btn-primary w-full py-3 text-sm flex items-center justify-center gap-2">
        <i data-lucide="log-in" class="w-4 h-4"></i> Sign In to Check Status
      </a>
      <a href="/auth/register.html" class="m3-btn-tonal w-full py-2.5 text-xs flex items-center justify-center gap-2">
        New User? Create Account
      </a>
    </div>
  </div>
  <script type="module">
    import { initIcons } from '/js/ui.js';
    initIcons();
  </script>
</body>
</html>
